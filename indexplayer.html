<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Film4K-style Player · Scrollable Subtitle Menu</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.17/dist/hls.min.js"></script>
<style>

@font-face{
  font-family:"Plus Jakarta Sans";
  src:url("https://film4k.net/cf-fonts/v/plus-jakarta-sans/5.2.8/latin/wght/normal.woff2") format("woff2");
  font-style:normal;
  font-weight:100 900;
  font-display:swap;
}

*{box-sizing:border-box}
:root{
  --c-bg:#090a0a;
  --c-ui:rgba(26,29,28,.94);
  --c-ui2:rgba(37,40,38,.96);
  --c-border:rgba(255,255,255,.12);
  --c-text:#f4f4f4;
  --c-dim:#b7b7b7;
}
body{
  margin:0;
  background:#0a0b0c;
  color:var(--c-text);
  font-family:"Plus Jakarta Sans",Inter,Arial,Helvetica,sans-serif;
}
.app{
  max-width:1200px;
  margin:18px auto;
  padding:0 14px;
}
.sourcebar{
  display:flex;
  gap:8px;
  margin-bottom:8px;
}
.headerbar{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:10px;
}
.headerbar input{
  min-width:0;
  border:1px solid #333;
  border-radius:8px;
  background:#151616;
  color:#fff;
  padding:9px 11px;
}
@media(max-width:700px){
  .headerbar{grid-template-columns:1fr}
}
.sourcebar input{
  flex:1;
  min-width:0;
  border:1px solid #333;
  border-radius:8px;
  background:#151616;
  color:#fff;
  padding:10px 12px;
}
.sourcebar button{
  border:0;
  border-radius:8px;
  padding:0 17px;
  font-weight:700;
  cursor:pointer;
}
.player{
  position:relative;
  background:#000;
  aspect-ratio:16/9;
  overflow:hidden;
  border:1px solid #111;
  user-select:none;
}
video{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}
.stats-btn{
  position:absolute;
  z-index:10;
  top:18px;
  left:18px;
  height:32px;
  border-radius:17px;
  border:1px solid rgba(255,255,255,.22);
  background:rgba(14,15,15,.77);
  color:#eee;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 14px;
  font-size:14px;
  font-weight:700;
  letter-spacing:.3px;
  cursor:pointer;
  backdrop-filter:blur(10px);
}
.stats-btn svg{width:17px;height:17px}
.stats-panel{
  display:none;
  position:absolute;
  z-index:12;
  top:57px;
  left:18px;
  min-width:220px;
  padding:11px 13px;
  border:1px solid var(--c-border);
  border-radius:12px;
  background:rgba(16,18,20,.82);
  font:12px/1.55 Consolas,monospace;
  box-shadow:0 12px 32px rgba(0,0,0,.45);
}
.stats-panel.show{display:block}

.buffering{
  position:absolute;
  inset:0;
  z-index:7;
  display:none;
  place-items:center;
  pointer-events:none;
}
.buffering.show{display:grid}
.spinner{
  width:38px;
  height:38px;
}
@keyframes spinner-fade{0%{opacity:1}to{opacity:.05}}
.spinner path{
  animation:spinner-fade 1s linear infinite;
}
.spinner path:nth-child(1){animation-delay:0s}
.spinner path:nth-child(2){animation-delay:.125s}
.spinner path:nth-child(3){animation-delay:.25s}
.spinner path:nth-child(4){animation-delay:.375s}
.spinner path:nth-child(5){animation-delay:.5s}
.spinner path:nth-child(6){animation-delay:.625s}
.spinner path:nth-child(7){animation-delay:.75s}
.spinner path:nth-child(8){animation-delay:.875s}

.controls{
  position:absolute;
  z-index:9;
  left:8px;
  right:8px;
  bottom:8px;
  min-height:44px;
  border:0;
  border-radius:9999px;
  background:rgba(18,20,22,.46);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.06),
    0 8px 24px rgba(0,0,0,.30),
    inset 0 1px 0 0 rgba(255,255,255,.06),
    inset 0 0 0 1px rgba(255,255,255,.03);
  backdrop-filter:blur(16px) saturate(1.5);
  -webkit-backdrop-filter:blur(16px) saturate(1.5);
  display:flex;
  align-items:center;
  padding:4px;
  gap:4px;
  transition:opacity .10s ease-out,transform .10s ease-out,filter .10s ease-out;
}
.player.idle .controls{
  opacity:0;
  transform:translateY(4px) scale(.95);
  filter:blur(8px);
  pointer-events:none;
}
.media-button-group{
  display:flex;
  align-items:center;
  gap:4px;
}
.media-button{
  width:36px;
  height:36px;
  min-height:0;
  padding:0;
  border:0;
  border-radius:9999px;
  background:transparent;
  color:#fff;
  display:grid;
  place-items:center;
  cursor:pointer;
  flex-shrink:0;
  transition:background-color .15s ease-out,scale .15s ease-out;
}
.media-button:hover{background:rgba(255,255,255,.08)}
.media-button svg{width:18px;height:18px}
.media-button .state-icon{display:none}
.media-button[data-state="play"] .play-icon{display:block}
.media-button[data-state="pause"] .pause-icon{display:block}
.media-button[data-state="restart"] .restart-icon{display:block}
.media-button[data-volume="high"] .vol-high{display:block}
.media-button[data-volume="off"] .vol-off{display:block}
.media-button[data-volume="low"] .vol-low{display:block}
.media-button[data-captions="on"] .cc-on{display:block}
.media-button[data-captions="off"] .cc-off{display:block}

.time-controls{
  flex:1;
  min-width:0;
  display:flex;
  align-items:center;
  gap:10px;
}
.media-time{
  font-size:14px;
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.slider-wrap{
  position:relative;
  flex:1;
  min-width:80px;
  height:32px;
  display:flex;
  align-items:center;
  cursor:pointer;
  border-radius:9999px;
}
.slider-track{
  position:absolute;
  left:0;
  right:0;
  height:4px;
  border-radius:9999px;
  background:rgba(255,255,255,.12);
  overflow:hidden;
  isolation:isolate;
}
.slider-buffer,
.slider-fill{
  position:absolute;
  left:0;
  top:0;
  bottom:0;
}
.slider-buffer{background:rgba(255,255,255,.16);width:0}
.slider-fill{background:currentColor;width:0}
.slider-thumb{
  position:absolute;
  top:50%;
  width:10px;
  height:10px;
  border-radius:9999px;
  background:currentColor;
  transform:translate(-50%,-50%);
  left:0;
  opacity:0;
  box-shadow:
    0 0 0 1px rgba(0,0,0,.10),
    0 1px 3px rgba(0,0,0,.35),
    0 1px 2px -1px rgba(0,0,0,.35);
  transition:opacity .15s ease-out,width .15s ease-out,height .15s ease-out;
}
.slider-wrap:hover .slider-thumb{opacity:1;width:12px;height:12px}
.slider-input{
  position:absolute;
  inset:0;
  opacity:0;
  pointer-events:none;
}
.preview{
  position:absolute;
  bottom:28px;
  transform:translateX(-50%);
  display:none;
  padding:5px 7px;
  border-radius:6px;
  background:rgba(18,20,19,.95);
  border:1px solid rgba(255,255,255,.10);
  font-size:12px;
  white-space:nowrap;
  pointer-events:none;
}
.slider-wrap:hover .preview{display:block}

.settings-menu,
.submenu{
  position:absolute;
  z-index:20;
  right:12px;
  bottom:74px;
  width:264px;
  border:1px solid rgba(255,255,255,.13);
  border-radius:16px;
  background:rgba(20,22,24,.58);
  box-shadow:0 14px 38px rgba(0,0,0,.45);
  overflow:hidden;
  display:none;
  backdrop-filter:blur(16px) saturate(1.5);
}
.settings-menu.show,.submenu.show{display:block}
.menu-row{
  min-height:42px;
  display:grid;
  grid-template-columns:28px 1fr auto 18px;
  align-items:center;
  gap:8px;
  padding:0 13px;
  cursor:pointer;
}
.menu-row:hover,.submenu-item:hover,.submenu-item.on{
  background:rgba(255,255,255,.08);
}
.menu-row .val{
  color:#b9b9b9;
  max-width:115px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.menu-row .chev{font-size:21px;color:#aaa}
.menu-row svg{width:19px;height:19px;opacity:.82}
.submenu-head{
  padding:12px 14px;
  border-bottom:1px solid rgba(255,255,255,.08);
  font-weight:700;
  cursor:pointer;
}
.submenu-item{
  padding:11px 14px;
  font-size:14px;
  cursor:pointer;
}

.status{
  margin-top:8px;
  font-size:12px;
  color:#888;
}
@media(max-width:720px){
  .player-watermark{font-size:20px;top:13px;right:13px}
  .stats-btn{top:11px;left:11px}
  .controls{left:6px;right:6px;bottom:7px;gap:5px}
  .media-button{width:34px;height:34px}
  .media-time{font-size:12px}
  .time-controls{gap:7px}
}

.volume-wrap{
  position:relative;
  display:flex;
  align-items:center;
}
.volume-pop{
  position:absolute;
  left:50%;
  bottom:44px;
  transform:translateX(-50%);
  width:32px;
  height:104px;
  padding:12px 0;
  border:0;
  border-radius:9999px;
  background:rgba(20,22,24,.58);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.06),
    0 8px 24px rgba(0,0,0,.28),
    inset 0 1px 0 0 rgba(255,255,255,.06),
    inset 0 0 0 1px rgba(255,255,255,.03);
  backdrop-filter:blur(16px) saturate(1.5);
  -webkit-backdrop-filter:blur(16px) saturate(1.5);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:25;
}
.volume-pop.show{display:flex}
.volume-slider{
  width:80px;
  height:4px;
  margin:0;
  transform:rotate(-90deg);
  accent-color:#fff;
  cursor:pointer;
}


html,body,button,input,select,textarea{
  font-family:"Plus Jakarta Sans",Inter,Arial,Helvetica,sans-serif;
}


/* ===== Original-player behavior layer ===== */
.player{cursor:default}
.player.controls-hidden{cursor:none}

/* Keep controls visible while paused or while an interactive popover is open. */
.player.force-controls .controls,
.player.force-controls .stats-btn{
  opacity:1!important;
  transform:none!important;
  filter:none!important;
  pointer-events:auto!important;
}

/* Original-like auto hide: fade + scale + blur + translate. */
.controls,
.stats-btn{
  transition:
    opacity .3s ease-out,
    transform .3s ease-out,
    filter .3s ease-out;
}
.player.controls-hidden .controls,
.player.controls-hidden .stats-btn{
  opacity:0;
  transform:translateY(4px) scale(.95);
  filter:blur(8px);
  pointer-events:none;
}

/* Playback/seek feedback bubble */
.input-feedback{
  position:absolute;
  z-index:18;
  inset:0;
  pointer-events:none;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  align-items:center;
}
.feedback-bubble{
  justify-self:center;
  display:none;
  place-items:center;
  min-width:72px;
  min-height:72px;
  padding:16px;
  border-radius:9999px;
  background:rgba(0,0,0,.35);
  color:white;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  opacity:0;
  transform:scale(.85);
  transition:opacity .2s ease-out,transform .2s ease-out;
}
.feedback-bubble.show{
  display:grid;
  opacity:1;
  transform:scale(1);
}
.feedback-bubble.seek-left{grid-column:1}
.feedback-bubble.seek-center{grid-column:2}
.feedback-bubble.seek-right{grid-column:3}
.feedback-bubble svg{width:30px;height:30px}
.feedback-seek{
  display:flex;
  align-items:center;
  gap:4px;
  font-weight:700;
  font-size:13px;
}
.feedback-seek svg{width:26px;height:26px}

/* Volume popover behavior closer to original. */
.volume-pop{
  opacity:0;
  filter:blur(4px);
  transform:translateX(-50%) translateY(6px) scale(.95);
  transform-origin:bottom;
  transition:opacity .1s ease-out,filter .1s ease-out,transform .1s ease-out;
  display:flex!important;
  visibility:hidden;
  pointer-events:none;
}
.volume-pop.show{
  opacity:1;
  filter:none;
  transform:translateX(-50%) translateY(0) scale(1);
  visibility:visible;
  pointer-events:auto;
}

/* Settings / submenu transitions */
.settings-menu,
.submenu{
  display:block!important;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  filter:blur(4px);
  transform:translateY(6px) scale(.95);
  transform-origin:bottom right;
  transition:opacity .1s ease-out,filter .1s ease-out,transform .1s ease-out;
}
.settings-menu.show,
.submenu.show{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
  filter:none;
  transform:none;
}

/* Sliding submenu panels similar to the original menu navigation. */
.submenu{
  overflow:hidden;
}
.submenu-inner{
  transition:transform .25s ease-in-out,filter .25s ease-in-out;
}
.submenu.enter-forward{
  transform:translateX(12px) scale(.98);
}
.submenu.enter-back{
  transform:translateX(-12px) scale(.98);
}

/* seek drag state */
.slider-wrap.dragging .slider-thumb{
  opacity:1!important;
  width:12px!important;
  height:12px!important;
}
.slider-wrap.dragging .preview{
  display:block!important;
}

/* active press effect */
.media-button:active:not(:disabled){transform:scale(.98)}

/* Reduced motion */
@media (prefers-reduced-motion:reduce){
  .controls,.stats-btn,.volume-pop,.settings-menu,.submenu,.feedback-bubble,.submenu-inner{
    transition-duration:50ms!important;
  }
  .player.controls-hidden .controls,
  .player.controls-hidden .stats-btn{
    transform:none;
    filter:none;
  }
}


/* Constrain settings/submenu height inside the player area */
.settings-menu,
.submenu{
  max-height:calc(100% - 96px);
  overflow:hidden;
}

.menu-scroll{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}

.settings-menu{
  display:flex!important;
  flex-direction:column;
}

.submenu{
  display:flex!important;
  flex-direction:column;
}

.submenu-head{
  flex:0 0 auto;
}

.menu-scroll::-webkit-scrollbar{
  width:10px;
}
.menu-scroll::-webkit-scrollbar-track{
  background:transparent;
}
.menu-scroll::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,.14);
  border-radius:9999px;
}
.menu-scroll{
  scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,.14) transparent;
}

</style>
</head>

<div class="app">

    <div class="stats-panel" id="statsPanel"></div>

    <div class="buffering" id="buffering">

        <path d="M1.5 9h3"/>
        <path d="m3.5 3.5 2 2"/>
      </svg>
    </div>
<div class="settings-menu" id="settingsMenu">
      <div class="menu-scroll" id="settingsScroll">
      
      <div class="menu-row" data-menu="quality">

          <path d="M7 9h10M7 13h6"/>
        </svg>
        <span>Quality</span><span class="val" id="qualityValue">Auto</span><span class="chev">›</span>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.2 2.3-5 6-5"/><path d="M14 7h7M14 11h7"/>
        </svg>
        <span>Audio</span><span class="val" id="audioValue">Default</span><span class="chev">›</span>
      </div>
      <div class="menu-row" data-menu="speed">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="8"/><path d="M12 12l4-3"/><path d="M7 18l-2 2M17 18l2 2"/>
        </svg>

          <rect x="3" y="5" width="18" height="14" rx="3"/><path d="M6 11h4M14 11h4M6 15h6M15 15h3"/>
        </svg>
        <span>Captions</span><span class="val" id="captionValue">Off</span><span class="chev">›</span>
      </div>
    
      </div>
    </div>

    <div class="submenu" id="submenu"></div>

    <div class="controls" id="controls">
      <div class="media-button-group">
        <button class="media-button" id="playBtn" data-state="play" aria-label="Play">
          <svg class="state-icon restart-icon" viewBox="0 0 18 18" fill="currentColor"><path d="M9 1a7.98 7.98 0 0 0-6.132 2.867l-1.441-1.44A.25.25 0 0 0 1 2.604V6.75c0 .138.112.25.25.25h4.146a.25.25 0 0 0 .177-.427L4.29 5.29A5.99 5.99 0 0 1 9 3a6 6 0 1 1-6 6H1a8 8 0 1 0 8-8"></path></svg>
          <svg class="state-icon play-icon" viewBox="0 0 18 18" fill="currentColor"><path d="m14.051 10.723-7.985 4.964a1.98 1.98 0 0 1-2.758-.638A2.06 2.06 0 0 1 3 13.964V4.036C3 2.91 3.895 2 5 2c.377 0 .747.109 1.066.313l7.985 4.964a2.057 2.057 0 0 1 .627 2.808c-.16.257-.373.475-.627.637"/></svg>
          <svg class="state-icon pause-icon" viewBox="0 0 18 18" fill="currentColor"><rect width="5" height="14" x="2" y="2" rx="1.75"/><rect width="5" height="14" x="11" y="2" rx="1.75"/></svg>
        </button>

        <div class="volume-wrap" id="volumeWrap">
<button class="media-button" id="muteBtn" data-volume="high" aria-label="Mute">

          <svg class="state-icon vol-low" viewBox="0 0 18 18" fill="currentColor"><path d="M.714 6.008h3.072l4.071-3.857c.5-.376 1.143 0 1.143.601V15.28c0 .602-.643.903-1.143.602l-4.071-3.858H.714c-.428 0-.714-.3-.714-.752V6.76c0-.451.286-.752.714-.752m10.568.59a.91.91 0 0 1 0-1.316.91.91 0 0 1 1.316 0c1.203 1.203 1.47 2.216 1.522 3.208q.012.255.011.51c0 1.16-.358 2.733-1.533 3.803a.7.7 0 0 1-.298.156c-.382.106-.873-.011-1.018-.156a.91.91 0 0 1 0-1.316c.57-.57.995-1.551.995-2.487 0-.944-.26-1.667-.995-2.402"/></svg>

          <svg class="state-icon cc-on" viewBox="0 0 18 18" fill="currentColor"><path d="M15 2a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H3a3 3 0 0 1-3-3V5a3 3 0 0 1 3-3zM4 11a1 1 0 1 0 0 2h5a1 1 0 1 0 0-2zm8 0a1 1 0 1 0 0 2h2a1 1 0 1 0 0-2zM4 8a1 1 0 0 0 0 2h1a1 1 0 0 0 0-2zm4 0a1 1 0 0 0 0 2h3a1 1 0 1 0 0-2zm6 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2"/></svg>

        </button>

</div>

<script>
const $=id=>document.getElementById(id);
const video=$('video'), player=$('player');
let hls=null,totalBytes=0,samples=[],fps=0,frames=[],idleTimer=null,feedbackTimer=null;
let menuOpen=false,volumeOpen=false,pointerSeeking=false;

function fmt(sec){
  sec=Number.isFinite(sec)&&sec>0?Math.floor(sec):0;
  const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
  return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function status(s){$('status').textContent=s}

function interactiveOpen(){
  return menuOpen || volumeOpen || pointerSeeking || !video.paused && document.activeElement?.closest?.('#player');
}

function showControls(schedule=true){
  player.classList.remove('controls-hidden');
  player.classList.remove('idle');
  clearTimeout(idleTimer);

  if(schedule && !video.paused && !menuOpen && !volumeOpen && !pointerSeeking){
    idleTimer=setTimeout(()=>{
      if(!video.paused && !menuOpen && !volumeOpen && !pointerSeeking){
        player.classList.add('controls-hidden');
      }
    },2200);
  }
}

function keepControls(){
  clearTimeout(idleTimer);
  player.classList.remove('controls-hidden');
}

['pointermove','pointerdown','touchstart'].forEach(ev=>{
  player.addEventListener(ev,()=>showControls(true),{passive:true});
});
player.addEventListener('pointerleave',()=>{
  if(!video.paused && !menuOpen && !volumeOpen && !pointerSeeking){
    clearTimeout(idleTimer);
    idleTimer=setTimeout(()=>player.classList.add('controls-hidden'),700);
  }
});

function addBytes(n){
  if(!n||n<0)return;
  totalBytes+=n;
  const now=performance.now();
  samples.push({t:now,b:n});
  while(samples.length&&samples[0].t<now-10000)samples.shift();
}
function bandwidth(){
  return samples.reduce((a,x)=>a+x.b,0)*8/10/1e6;
}

if(video.requestVideoFrameCallback){
  const cb=(now,m)=>{
    frames.push(m.mediaTime);
    while(frames.length>1&&frames[0]<m.mediaTime-2)frames.shift();
    if(frames.length>1)fps=(frames.length-1)/(frames.at(-1)-frames[0]);
    video.requestVideoFrameCallback(cb);
  };
  video.requestVideoFrameCallback(cb);
}


function showFeedback(id){
  const el=$(id);
  if(!el)return;
  document.querySelectorAll('.feedback-bubble').forEach(x=>x.classList.remove('show'));
  clearTimeout(feedbackTimer);
  el.classList.add('show');
  feedbackTimer=setTimeout(()=>el.classList.remove('show'),260);
}

function seekBy(seconds){
  const b=timelineBounds();
  let target=video.currentTime+seconds;
  if(b.length)target=Math.min(b.end,Math.max(b.start,target));
  else target=Math.max(0,target);
  try{video.currentTime=target}catch{}
  showFeedback(seconds<0?'feedbackBack':'feedbackForward');
  showControls(true);
}

function updateStats(){
  const l=hls&&hls.currentLevel>=0?hls.levels[hls.currentLevel]:null;
  $('statsPanel').innerHTML=
    `Resolution: ${video.videoWidth?video.videoWidth+'×'+video.videoHeight:'—'}<br>`+
    `FPS: ${fps?Math.round(fps):'—'}<br>`+
    `Bitrate: ${l?.bitrate?(l.bitrate/1e6).toFixed(2)+' Mbps':'—'}<br>`+
    `Bandwidth: ${bandwidth().toFixed(2)} Mbps<br>`+
    `Used: ${(totalBytes/1e6).toFixed(1)} MB`;
}

function timelineBounds(){
  // For normal VOD, duration gives the complete timeline.
  if(Number.isFinite(video.duration) && video.duration > 0){
    return {start:0,end:video.duration,length:video.duration};
  }

  // For live/sliding HLS playlists, duration may be Infinity.
  // In that case use the actual seekable window.
  try{
    if(video.seekable && video.seekable.length){
      const start=video.seekable.start(0);
      const end=video.seekable.end(video.seekable.length-1);
      if(Number.isFinite(start) && Number.isFinite(end) && end>start){
        return {start,end,length:end-start};
      }
    }
  }catch{}

  return {start:0,end:0,length:0};
}

function timelineRatio(time){
  const b=timelineBounds();
  if(!b.length)return 0;
  return Math.min(1,Math.max(0,(time-b.start)/b.length));
}

function updateControls(){
  $('playBtn').dataset.state=video.ended?'restart':(video.paused?'play':'pause');

  const v=video.muted||video.volume===0?'off':video.volume<0.5?'low':'high';
  $('muteBtn').dataset.volume=v;
  $('volumeSlider').value=Math.round(video.volume*100);

  const b=timelineBounds();
  const p=timelineRatio(video.currentTime);

  $('currentTime').textContent=fmt(video.currentTime);
  $('remainingTime').innerHTML='<span>-</span>'+fmt(
    b.length ? Math.max(0,b.end-video.currentTime) : 0
  );

  $('seek').value=Math.round(p*1000);
  $('sliderFill').style.width=(p*100)+'%';
  $('sliderThumb').style.left=(p*100)+'%';

  let bufferedRatio=0;
  try{
    if(b.length && video.buffered.length){
      let bufferedEnd=b.start;
      // Use the buffered range containing/nearest the playhead.
      for(let i=0;i<video.buffered.length;i++){
        const s=video.buffered.start(i);
        const e=video.buffered.end(i);
        if(video.currentTime>=s-0.05 && video.currentTime<=e+0.05){
          bufferedEnd=e;
          break;
        }
        if(e>bufferedEnd)bufferedEnd=e;
      }
      bufferedRatio=Math.min(1,Math.max(0,(bufferedEnd-b.start)/b.length));
    }
  }catch{}
  $('sliderBuffer').style.width=(bufferedRatio*100)+'%';
}
setInterval(()=>{updateControls();updateStats()},250);

const sliderWrap=$('sliderWrap');
function pointerRatio(clientX){
  const r=sliderWrap.getBoundingClientRect();
  if(!r.width)return 0;
  return Math.min(1,Math.max(0,(clientX-r.left)/r.width));
}

function seekToRatio(ratio){
  const b=timelineBounds();
  if(!b.length)return;
  const target=b.start + ratio*b.length;

  try{
    // Clamp to the currently seekable range when available.
    if(video.seekable && video.seekable.length){
      let best=target;
      let found=false;
      for(let i=0;i<video.seekable.length;i++){
        const s=video.seekable.start(i);
        const e=video.seekable.end(i);
        if(target>=s && target<=e){
          best=target;
          found=true;
          break;
        }
        if(target<s){
          best=s;
          found=true;
          break;
        }
        best=e;
      }
      video.currentTime=best;
    }else{
      video.currentTime=target;
    }
  }catch{
    try{video.currentTime=target}catch{}
  }

  updateControls();
}

function updatePreview(clientX){
  const ratio=pointerRatio(clientX);
  const b=timelineBounds();
  $('preview').style.left=(ratio*100)+'%';
  $('preview').textContent=fmt(b.start + ratio*b.length);
}

sliderWrap.addEventListener('pointerdown',e=>{
  if(e.button!==undefined && e.button!==0)return;
  e.preventDefault();
  pointerSeeking=true;
  sliderWrap.classList.add('dragging');
  keepControls();
  try{sliderWrap.setPointerCapture(e.pointerId)}catch{}
  updatePreview(e.clientX);
  seekToRatio(pointerRatio(e.clientX));
});

sliderWrap.addEventListener('pointermove',e=>{
  updatePreview(e.clientX);
  if(pointerSeeking){
    e.preventDefault();
    seekToRatio(pointerRatio(e.clientX));
  }
});

function finishPointerSeek(e){
  if(!pointerSeeking)return;
  pointerSeeking=false;
  sliderWrap.classList.remove('dragging');
  try{sliderWrap.releasePointerCapture(e.pointerId)}catch{}
  seekToRatio(pointerRatio(e.clientX));
}

sliderWrap.addEventListener('pointerup',finishPointerSeek);
sliderWrap.addEventListener('pointercancel',()=>{pointerSeeking=false;sliderWrap.classList.remove('dragging');showControls(true)});

$('playBtn').onclick=()=>{
  if(video.ended){
    try{video.currentTime=0}catch{}
    video.play().catch(()=>{});
    showFeedback('feedbackPlay');
  }else if(video.paused){
    video.play().catch(()=>{});
    showFeedback('feedbackPlay');
  }else{
    video.pause();
    showFeedback('feedbackPause');
  }
  showControls(true);
};
let volumeOpenTimer=null,volumeCloseTimer=null;

function setVolumePopover(open){
  clearTimeout(volumeOpenTimer);
  clearTimeout(volumeCloseTimer);
  volumeOpen=open;
  $('volumePop').classList.toggle('show',open);
  if(open)keepControls();
  else showControls(true);
}

function scheduleVolumeOpen(){
  clearTimeout(volumeCloseTimer);
  volumeOpenTimer=setTimeout(()=>setVolumePopover(true),200);
}
function scheduleVolumeClose(){
  clearTimeout(volumeOpenTimer);
  volumeCloseTimer=setTimeout(()=>setVolumePopover(false),100);
}

$('volumeWrap').addEventListener('pointerenter',scheduleVolumeOpen);
$('volumeWrap').addEventListener('pointerleave',scheduleVolumeClose);
$('volumePop').addEventListener('pointerenter',()=>{clearTimeout(volumeCloseTimer);setVolumePopover(true)});
$('volumePop').addEventListener('pointerleave',scheduleVolumeClose);

$('muteBtn').onclick=e=>{
  e.stopPropagation();
  setVolumePopover(!volumeOpen);
};

$('volumeSlider').addEventListener('input',e=>{
  e.stopPropagation();
  const v=Math.max(0,Math.min(100,Number(e.target.value)))/100;
  video.volume=v;
  video.muted=v===0;
  keepControls();
  updateControls();
});

$('volumeSlider').addEventListener('click',e=>e.stopPropagation());
$('volumeWrap').addEventListener('click',e=>e.stopPropagation());

document.addEventListener('click',e=>{
  if(!e.target.closest('#volumeWrap') && volumeOpen)setVolumePopover(false);
});

$('statsBtn').onclick=()=>{$('statsPanel').classList.toggle('show');updateStats()};

function closeMenus(){
  menuOpen=false;
  $('settingsMenu').classList.remove('show');
  $('submenu').classList.remove('show','enter-forward','enter-back');
  showControls(true);
}
$('settingsBtn').onclick=e=>{
  e.stopPropagation();
  const open=!$('settingsMenu').classList.contains('show');
  $('submenu').classList.remove('show','enter-forward','enter-back');
  $('settingsMenu').classList.toggle('show',open);
  menuOpen=open;
  if(open)keepControls(); else showControls(true);
};
$('ccBtn').onclick=e=>{
  e.stopPropagation();
  if(hls && (hls.subtitleTracks||[]).length){
    if(hls.subtitleTrack>=0){
      hls.subtitleTrack=-1;
      hls.subtitleDisplay=false;
      $('captionValue').textContent='Off';
      $('ccBtn').dataset.captions='off';
    }else{
      const first=(hls.subtitleTracks||[]).findIndex(Boolean);
      if(first>=0){
        hls.subtitleTrack=first;
        hls.subtitleDisplay=true;
        const s=hls.subtitleTracks[first];
        $('captionValue').textContent=s?.name||s?.lang||'On';
        $('ccBtn').dataset.captions='on';
      }
    }
    keepControls();
  }else{
    openSub('captions');
  }
};

document.addEventListener('click',e=>{
  if(!e.target.closest('#settingsMenu')&&!e.target.closest('#submenu')&&!e.target.closest('#settingsBtn')&&!e.target.closest('#ccBtn'))closeMenus();
});

document.querySelectorAll('.menu-row').forEach(x=>x.onclick=()=>{keepControls();openSub(x.dataset.menu)});

function openSub(kind){
  menuOpen=true;
  keepControls();
  const box=$('submenu');
  box.classList.remove('enter-back');
  box.classList.add('enter-forward');

  box.innerHTML='';
  const head=document.createElement('div');
  head.className='submenu-head';
  head.textContent='‹ ' + kind[0].toUpperCase() + kind.slice(1);
  head.onclick=()=>{
    box.classList.remove('enter-forward');
    box.classList.add('enter-back');
    setTimeout(()=>{
      box.classList.remove('show','enter-back');
      $('settingsMenu').classList.add('show');
      menuOpen=true;
      keepControls();
    },120);
  };
  box.appendChild(head);

  const scroll=document.createElement('div');
  scroll.className='menu-scroll';
  box.appendChild(scroll);

  let items=[];
  if(kind==='quality'){
    items=[{label:'Auto',value:-1,on:!hls || hls.autoLevelEnabled || hls.currentLevel<0}];
    (hls?.levels||[]).forEach((l,i)=>{
      const label=`${l.height||'?'}p${l.bitrate?' · '+Math.round(l.bitrate/1000)+' kbps':''}`;
      items.push({label,value:i,on:!!hls && !hls.autoLevelEnabled && hls.currentLevel===i});
    });
  }
  if(kind==='speed'){
    items=[.5,.75,1,1.25,1.5,2].map(v=>({label:v+'×',value:v,on:video.playbackRate===v}));
  }
  if(kind==='audio'){
    items=(hls?.audioTracks||[]).map((t,i)=>({label:t.name||t.lang||`Audio ${i+1}`,value:i,on:hls.audioTrack===i}));
    if(!items.length)items=[{label:'Default',value:-1,on:true}];
  }
  if(kind==='captions'){
    items=[{label:'Off',value:-1,on:(hls?.subtitleTrack??-1)<0}];
    (hls?.subtitleTracks||[]).forEach((t,i)=>items.push({label:t.name||t.lang||`Subtitle ${i+1}`,value:i,on:hls.subtitleTrack===i}));
  }

  for(const it of items){
    const row=document.createElement('div');
    row.className='submenu-item'+(it.on?' on':'');
    row.textContent=(it.on?'✓ ':'')+it.label;
    row.onclick=()=>{
      if(kind==='quality'&&hls){
        if(it.value<0){
          hls.currentLevel=-1;
          hls.nextLevel=-1;
          $('qualityValue').textContent='Auto';
        }else{
          hls.currentLevel=it.value;
          $('qualityValue').textContent=it.label.split(' · ')[0];
        }
      }else if(kind==='speed'){
        video.playbackRate=it.value;
        $('speedValue').textContent=it.label;
      }else if(kind==='audio'&&hls){
        if(it.value>=0)hls.audioTrack=it.value;
        $('audioValue').textContent=it.label;
      }else if(kind==='captions'&&hls){
        hls.subtitleTrack=it.value;
        hls.subtitleDisplay=it.value>=0;
        $('captionValue').textContent=it.label;
        $('ccBtn').dataset.captions=it.value>=0?'on':'off';
      }
      closeMenus();
    };
    scroll.appendChild(row);
  }

  $('settingsMenu').classList.remove('show');
  box.classList.add('show');
  requestAnimationFrame(()=>box.classList.remove('enter-forward'));
}

$('pipBtn').onclick=async()=>{
  try{
    if(document.pictureInPictureElement)await document.exitPictureInPicture();
    else await video.requestPictureInPicture?.();
  }catch{}
  showControls(true);
};
$('fullBtn').onclick=async()=>{
  try{
    if(!document.fullscreenElement)await player.requestFullscreen();
    else await document.exitFullscreen();
  }catch{}
  showControls(true);
};

video.addEventListener('volumechange',updateControls);

video.addEventListener('click',()=>{
  if(video.paused){
    video.play().catch(()=>{});
    showFeedback('feedbackPlay');
  }else{
    video.pause();
    showFeedback('feedbackPause');
  }
  showControls(true);
});
video.addEventListener('dblclick',()=>$('fullBtn').click());

video.addEventListener('play',()=>showControls(true));
video.addEventListener('pause',()=>showControls(false));
video.addEventListener('ended',()=>showControls(false));

document.addEventListener('fullscreenchange',()=>{
  $('fullBtn').dataset.fullscreen=document.fullscreenElement?'true':'false';
  showControls(true);
});
video.addEventListener('enterpictureinpicture',()=>{
  $('pipBtn').dataset.pip='true';
  showControls(true);
});
video.addEventListener('leavepictureinpicture',()=>{
  $('pipBtn').dataset.pip='false';
  showControls(true);
});

video.addEventListener('waiting',()=>$('buffering').classList.add('show'));
video.addEventListener('stalled',()=>$('buffering').classList.add('show'));
video.addEventListener('playing',()=>$('buffering').classList.remove('show'));
video.addEventListener('canplay',()=>$('buffering').classList.remove('show'));

window.addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;

  const key=e.key.toLowerCase();

  if(e.code==='Space'||key==='k'){
    e.preventDefault();
    $('playBtn').click();
  }
  else if(key==='m'){
    e.preventDefault();
    video.muted=!video.muted;
    showControls(true);
  }
  else if(key==='f'){
    e.preventDefault();
    $('fullBtn').click();
  }
  else if(key==='c'){
    e.preventDefault();
    $('ccBtn').click();
  }
  else if(e.key==='ArrowLeft'){
    e.preventDefault();
    seekBy(-10);
  }
  else if(e.key==='ArrowRight'){
    e.preventDefault();
    seekBy(10);
  }
  else if(e.key==='ArrowUp'){
    e.preventDefault();
    video.muted=false;
    video.volume=Math.min(1,video.volume+.1);
    showControls(true);
  }
  else if(e.key==='ArrowDown'){
    e.preventDefault();
    video.volume=Math.max(0,video.volume-.1);
    video.muted=video.volume===0;
    showControls(true);
  }
};

function refreshLabels(){
  if(!hls)return;

  if(hls.autoLevelEnabled || hls.currentLevel<0){
    $('qualityValue').textContent='Auto';
  }else{
    const q=hls.levels?.[hls.currentLevel];
    $('qualityValue').textContent=q?.height?`${q.height}p`:`Level ${hls.currentLevel+1}`;
  }

  const a=hls.audioTracks?.[hls.audioTrack];
  $('audioValue').textContent=a?(a.name||a.lang||'Audio'):'Default';
  const s=hls.subtitleTrack>=0?hls.subtitleTracks?.[hls.subtitleTrack]:null;
  $('captionValue').textContent=s?(s.name||s.lang||'On'):'Off';
  $('ccBtn').dataset.captions=s?'on':'off';
}


function proxied(url){
  const origin=$('origin').value.trim();
  const referer=$('referer').value.trim();
  const q=new URLSearchParams({url});
  if(origin)q.set('origin',origin);
  if(referer)q.set('referer',referer);
  return `/api/hlsproxy?${q.toString()}`;
}

function load(useProxy=false){
  let src=$('source').value.trim();
  if(!src)return status('Vui lòng nhập link .m3u8.');

  if(hls){try{hls.destroy()}catch{}}
  totalBytes=0;samples=[];
  video.pause();
  video.removeAttribute('src');
  video.load();
  $('buffering').classList.add('show');
  if(useProxy){
    const o=$('origin').value.trim(), r=$('referer').value.trim();
    status(`Đang tải qua Python proxy${o?' · Origin='+o:''}${r?' · Referer='+r:''}...`);
  }else{
    status('Đang tải manifest trực tiếp...');
  }

  if(useProxy) src=proxied(src);

  if(video.canPlayType('application/vnd.apple.mpegurl')&&!Hls.isSupported()){
    video.src=src;
    video.play().catch(()=>{});
    status((useProxy?'PROXY':'DIRECT')+' · Native HLS.');
    return;
  }
  if(!window.Hls||!Hls.isSupported()){
    status('Trình duyệt không hỗ trợ HLS/MSE.');
    return;
  }

  class CountingLoader extends Hls.DefaultConfig.loader{
    constructor(c){super(c);this.prev=0}
    load(ctx,cfg,cb){
      const p=cb.onProgress;
      cb.onProgress=(st,c,d,n)=>{
        const cur=st.loaded||0;
        if(cur>this.prev){addBytes(cur-this.prev);this.prev=cur}
        p?.(st,c,d,n);
      };
      return super.load(ctx,cfg,cb);
    }
  }

  hls=new Hls({
    fLoader:CountingLoader,
    renderTextTracksNatively:true,
    progressive:false,
    maxBufferLength:90,
    maxMaxBufferLength:300,
    maxBufferSize:150000000,
    startFragPrefetch:true,
    abrEwmaDefaultEstimate:800000,
    maxStarvationDelay:30,
    maxLoadingDelay:30,
    maxBufferHole:1,
    nudgeOffset:.2,
    nudgeMaxRetry:6
  });

  hls.attachMedia(video);
  hls.loadSource(src);

  hls.on(Hls.Events.MANIFEST_PARSED,()=>{
    refreshLabels();
    $('buffering').classList.remove('show');
    status(`${useProxy?'PROXY':'DIRECT'} · Manifest OK · ${hls.levels.length} quality level(s).`);
    video.play().catch(()=>{});
  });
  hls.on(Hls.Events.AUDIO_TRACK_SWITCHED,refreshLabels);
  hls.on(Hls.Events.SUBTITLE_TRACK_SWITCH,refreshLabels);
  hls.on(Hls.Events.LEVEL_SWITCHED,refreshLabels);
  hls.on(Hls.Events.LEVEL_UPDATED,refreshLabels);

  hls.on(Hls.Events.ERROR,(_,d)=>{
    if(!d.fatal)return;
    if(d.type===Hls.ErrorTypes.NETWORK_ERROR){
      status(`${useProxy?'PROXY':'DIRECT'} · Network error — retrying...`);
      try{hls.startLoad()}catch{}
    }else if(d.type===Hls.ErrorTypes.MEDIA_ERROR){
      status(`${useProxy?'PROXY':'DIRECT'} · Media error — recovering...`);
      try{hls.recoverMediaError()}catch{}
    }else{
      status(`${useProxy?'PROXY':'DIRECT'} · Fatal: ${d.type} / ${d.details}`);
      $('buffering').classList.remove('show');
    }
  });
}

showControls(false);

$('direct').onclick=()=>load(false);
$('proxy').onclick=()=>load(true);
$('source').addEventListener('keydown',e=>{if(e.key==='Enter')load(false)});
</script>
</body>
</html>
