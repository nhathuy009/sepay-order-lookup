<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>123AV Player - HLS Tester</title>
    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@0.14.17/dist/hls.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(90deg, #e74c3c, #f39c12);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.5px;
        }

        .header h1 small {
            font-size: 12px;
            -webkit-text-fill-color: #888;
            font-weight: 400;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .header-controls input {
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid #444;
            background: #1a1a2e;
            color: #fff;
            font-size: 14px;
            width: 200px;
            outline: none;
            transition: border 0.3s;
        }

        .header-controls input:focus {
            border-color: #e74c3c;
        }

        .header-controls input::placeholder {
            color: #666;
        }

        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            background: #333;
            color: #fff;
        }

        .btn-primary {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
        }
        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(231, 76, 60, 0.4);
        }
        .btn-secondary { background: #2c3e50; }
        .btn-secondary:hover { background: #34495e; }
        .btn-success { background: #27ae60; }
        .btn-success:hover { background: #2ecc71; }
        .btn-warning { background: #f39c12; color: #222; }
        .btn-warning:hover { background: #e67e22; }
        .btn-danger { background: #e74c3c; }
        .btn-danger:hover { background: #c0392b; }

        .player-wrapper {
            max-width: 960px;
            margin: 20px auto;
            padding: 0 16px;
        }

        .player-container {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.8);
        }

        #videoPlayer {
            width: 100%;
            height: 100%;
            background: #000;
            display: block;
        }

        .video-info {
            padding: 16px 4px 8px;
        }

        .video-info h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #eee;
            word-break: break-word;
        }

        .video-info .meta {
            font-size: 13px;
            color: #888;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .video-info .meta span {
            background: #1a1a2e;
            padding: 2px 12px;
            border-radius: 12px;
            border: 1px solid #2a2a3e;
        }

        .player-status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        .player-status .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #333;
            border-top-color: #e74c3c;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .player-status .status-text {
            font-size: 14px;
            color: #aaa;
            background: rgba(0,0,0,0.7);
            padding: 6px 18px;
            border-radius: 20px;
            display: inline-block;
        }

        .player-status.hidden {
            display: none;
        }

        .plugin-panel {
            max-width: 960px;
            margin: 20px auto;
            padding: 0 16px;
        }

        .panel-toggle {
            background: #1a1a2e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 12px 16px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.3s;
            width: 100%;
            font-size: 14px;
            color: #ccc;
        }

        .panel-toggle:hover {
            background: #222244;
        }

        .panel-toggle .arrow {
            transition: transform 0.3s;
        }
        .panel-toggle .arrow.open {
            transform: rotate(180deg);
        }

        .panel-content {
            background: #111122;
            border: 1px solid #333;
            border-top: none;
            border-radius: 0 0 12px 12px;
            padding: 16px;
            display: none;
            max-height: 500px;
            overflow-y: auto;
        }

        .panel-content.open {
            display: block;
        }

        .panel-content label {
            display: block;
            font-size: 12px;
            color: #888;
            margin-top: 12px;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .panel-content input, 
        .panel-content textarea,
        .panel-content select {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #0a0a1a;
            color: #fff;
            font-size: 13px;
            font-family: monospace;
            outline: none;
            transition: border 0.3s;
        }

        .panel-content input:focus,
        .panel-content textarea:focus {
            border-color: #e74c3c;
        }

        .panel-content textarea {
            min-height: 100px;
            resize: vertical;
        }

        .panel-content .row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .panel-content .row .col {
            flex: 1;
            min-width: 120px;
        }

        .panel-content .row .col.small {
            flex: 0 0 auto;
        }

        .plugin-status {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        .plugin-status.loaded {
            background: #27ae60;
            color: #fff;
        }

        .plugin-status.error {
            background: #e74c3c;
            color: #fff;
        }

        .plugin-status.idle {
            background: #555;
            color: #ccc;
        }

        .plugin-status.loading {
            background: #f39c12;
            color: #222;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .sections-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            margin: 12px 0;
        }

        .sections-grid .section-item {
            background: #1a1a2e;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #2a2a3e;
            cursor: pointer;
            text-align: center;
            font-size: 13px;
            transition: all 0.3s;
        }

        .sections-grid .section-item:hover {
            background: #2a2a4e;
            border-color: #e74c3c;
            transform: translateY(-2px);
        }

        .sections-grid .section-item .badge {
            display: block;
            font-size: 10px;
            color: #888;
            margin-top: 4px;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
            max-width: 960px;
            margin: 20px auto;
            padding: 0 16px;
        }

        .movie-card {
            background: #111122;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #222;
            cursor: pointer;
            transition: all 0.3s;
        }

        .movie-card:hover {
            transform: translateY(-4px);
            border-color: #e74c3c;
            box-shadow: 0 8px 30px rgba(231, 76, 60, 0.2);
        }

        .movie-card .thumb {
            width: 100%;
            aspect-ratio: 2 / 3;
            background: #1a1a2e;
            object-fit: cover;
            display: block;
        }

        .movie-card .info {
            padding: 10px 12px;
        }

        .movie-card .info .title {
            font-size: 13px;
            font-weight: 500;
            color: #eee;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }

        .movie-card .info .sub {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 20px 0 40px;
            flex-wrap: wrap;
        }

        .pagination .page-btn {
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #1a1a2e;
            color: #aaa;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }

        .pagination .page-btn:hover {
            background: #2a2a4e;
            color: #fff;
        }

        .pagination .page-btn.active {
            background: #e74c3c;
            border-color: #e74c3c;
            color: #fff;
        }

        .debug-info {
            font-size: 11px;
            color: #555;
            padding: 8px 12px;
            background: #0a0a1a;
            border-radius: 6px;
            margin-top: 4px;
            word-break: break-all;
            font-family: monospace;
            max-height: 60px;
            overflow-y: auto;
        }

        .debug-info .highlight {
            color: #f39c12;
        }

        /* ===== OVERLAY LỖI CHI TIẾT ===== */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.92);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay .error-box {
            background: #1a1a2e;
            border: 2px solid #e74c3c;
            border-radius: 16px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .overlay .error-box .icon {
            font-size: 48px;
            margin-bottom: 16px;
            text-align: center;
        }

        .overlay .error-box h2 {
            color: #e74c3c;
            margin-bottom: 12px;
            text-align: center;
        }

        .overlay .error-box .error-detail {
            background: #0a0a1a;
            border-radius: 8px;
            padding: 16px;
            margin: 12px 0;
            border-left: 4px solid #e74c3c;
        }

        .overlay .error-box .error-detail.success {
            border-left-color: #2ecc71;
        }

        .overlay .error-box .error-detail.warning {
            border-left-color: #f39c12;
        }

        .overlay .error-box .error-detail .label {
            color: #888;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .overlay .error-box .error-detail .value {
            color: #f39c12;
            font-family: monospace;
            font-size: 13px;
            word-break: break-all;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .overlay .error-box .error-detail .value.error-text {
            color: #e74c3c;
        }

        .overlay .error-box .error-detail .value.success-text {
            color: #2ecc71;
        }

        .overlay .error-box .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 16px;
        }

        .overlay .error-box .btn-group .btn {
            min-width: 120px;
        }

        .console-log {
            max-height: 200px;
            overflow-y: auto;
            background: #0a0a1a;
            border-radius: 8px;
            padding: 12px;
            margin: 8px 0;
            font-family: monospace;
            font-size: 12px;
            line-height: 1.6;
        }

        .console-log .log-error {
            color: #e74c3c;
        }
        .console-log .log-warn {
            color: #f39c12;
        }
        .console-log .log-info {
            color: #3498db;
        }
        .console-log .log-success {
            color: #2ecc71;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        @media (max-width: 640px) {
            .header h1 { font-size: 16px; }
            .header-controls input { width: 140px; font-size: 12px; }
            .movie-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
            .sections-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
            .panel-content .row .col { min-width: 100px; }
            .overlay .error-box { padding: 24px; margin: 16px; }
            .overlay .error-box .btn-group .btn { min-width: 100px; font-size: 12px; }
        }
    </style>
</head>
<body>

<!-- ===== OVERLAY LỖI CHI TIẾT ===== -->
<div class="overlay" id="errorOverlay">
    <div class="error-box">
        <div class="icon" id="errorIcon">🔍</div>
        <h2 id="errorTitle">Đang kiểm tra...</h2>
        
        <div id="errorContent">
            <!-- Nội dung lỗi sẽ được render động -->
        </div>

        <div class="btn-group" id="errorButtons">
            <button class="btn btn-primary" onclick="retryLoadPlugin()">🔄 Thử lại</button>
            <button class="btn btn-warning" onclick="openPanelAndPaste()">📋 Dán plugin thủ công</button>
            <button class="btn btn-secondary" onclick="showSystemInfo()">🖥️ Thông tin hệ thống</button>
            <button class="btn btn-danger" onclick="showPluginCode()">📄 Xem plugin code</button>
        </div>
    </div>
</div>

<!-- ===== HEADER ===== -->
<header class="header">
    <h1>🎬 123AV <small>HLS Tester</small></h1>
    <div class="header-controls">
        <input type="text" id="searchInput" placeholder="Tìm kiếm phim..." />
        <button class="btn btn-primary" onclick="doSearch()">🔍 Tìm</button>
        <button class="btn btn-secondary" onclick="loadHome()">🏠 Home</button>
        <button class="btn btn-danger" onclick="showDebugInfo()">🐛 Debug</button>
    </div>
</header>

<!-- ===== PLAYER ===== -->
<div class="player-wrapper">
    <div class="player-container" id="playerContainer">
        <video id="videoPlayer" controls playsinline></video>
        <div class="player-status" id="playerStatus">
            <div class="spinner"></div>
            <div class="status-text">⏳ Đang tải video...</div>
        </div>
    </div>
    <div class="video-info" id="videoInfo">
        <h2 id="videoTitle">Chọn một bộ phim để xem</h2>
        <div class="meta" id="videoMeta">
            <span>🎥 Chất lượng: HD</span>
            <span>📅 Năm: --</span>
            <span>🎭 Thể loại: --</span>
        </div>
        <div class="debug-info" id="debugInfo">📡 Đang chờ...</div>
    </div>
</div>

<!-- ===== PLUGIN PANEL ===== -->
<div class="plugin-panel">
    <button class="panel-toggle" onclick="togglePanel()">
        <span>⚙️ Plugin 123AV v1.0.4</span>
        <span class="arrow" id="panelArrow">▼</span>
    </button>
    <div class="panel-content" id="panelContent">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:12px;">
            <span>Trạng thái: <span class="plugin-status idle" id="pluginStatus">⏳ Chưa tải</span></span>
            <div>
                <button class="btn btn-success" onclick="loadPlugin()">📥 Nạp Plugin</button>
                <button class="btn btn-secondary" onclick="loadHome()">🏠 Home</button>
            </div>
        </div>

        <label>📋 Danh sách Section</label>
        <div class="sections-grid" id="sectionsGrid">
            <div class="section-item" style="opacity:0.3;cursor:not-allowed;">🆕 Mới cập nhật</div>
            <div class="section-item" style="opacity:0.3;cursor:not-allowed;">🔥 Hot</div>
            <div class="section-item" style="opacity:0.3;cursor:not-allowed;">🔞 Có che</div>
            <div class="section-item" style="opacity:0.3;cursor:not-allowed;">🔞 Không che</div>
            <div class="section-item" style="opacity:0.3;cursor:not-allowed;">💥 Leaked</div>
        </div>

        <label>🔗 URL tùy chỉnh</label>
        <div class="row">
            <div class="col">
                <input type="text" id="customUrl" placeholder="https://123av.com/vi/v/cawb-024" />
            </div>
            <div class="col small">
                <button class="btn btn-primary" onclick="playCustomUrl()">▶️ Phát</button>
            </div>
        </div>

        <label>🔧 CORS Header</label>
        <div class="row">
            <div class="col">
                <input type="text" id="corsOrigin" value="https://123av.com" placeholder="Origin" />
            </div>
            <div class="col small">
                <button class="btn btn-warning" onclick="toggleCorsHeader()">🔄 Bật/Tắt</button>
            </div>
        </div>
        <div style="font-size:11px; color:#666; margin-top:4px;">
            CORS Header: <span id="corsStatus">🟢 Bật (Origin: https://123av.com)</span>
        </div>

        <label>📦 Plugin Code (JavaScript)</label>
        <textarea id="pluginCode" spellcheck="false" placeholder="Dán plugin code vào đây...">// Dán plugin code vào đây hoặc bấm "Nạp Plugin"</textarea>
        <div style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap;">
            <button class="btn btn-primary" onclick="loadPlugin()">📥 Nạp Plugin</button>
            <button class="btn btn-secondary" onclick="resetPlugin()">🔄 Reset</button>
            <button class="btn btn-secondary" onclick="showPluginCode()">📄 Xem code</button>
        </div>
    </div>
</div>

<!-- ===== MOVIE GRID ===== -->
<div class="movie-grid" id="movieGrid">
    <div style="grid-column:1/-1; text-align:center; color:#666; padding:40px 0;">
        ⏳ Đang tải plugin...
    </div>
</div>

<!-- ===== PAGINATION ===== -->
<div class="pagination" id="pagination"></div>

<!-- ========================================================================== -->
<!-- ===== MAIN JAVASCRIPT ===== -->
<!-- ========================================================================== -->
<script>
    // ============================================================
    // STATE
    // ============================================================
    const state = {
        plugin: null,
        pluginLoaded: false,
        currentSlug: 'vi/new',
        currentPage: 1,
        totalPages: 1,
        filters: { sort: 'new' },
        sections: [],
        currentStreamUrl: null,
        corsEnabled: true,
        corsOrigin: 'https://123av.com',
        debugMode: true,
        errorLog: [],
    };

    // ============================================================
    // DOM REFS
    // ============================================================
    const video = document.getElementById('videoPlayer');
    const videoTitle = document.getElementById('videoTitle');
    const videoMeta = document.getElementById('videoMeta');
    const debugInfo = document.getElementById('debugInfo');
    const playerStatus = document.getElementById('playerStatus');
    const movieGrid = document.getElementById('movieGrid');
    const pagination = document.getElementById('pagination');
    const searchInput = document.getElementById('searchInput');
    const pluginCode = document.getElementById('pluginCode');
    const pluginStatus = document.getElementById('pluginStatus');
    const corsOriginInput = document.getElementById('corsOrigin');
    const corsStatus = document.getElementById('corsStatus');
    
    // Error overlay
    const errorOverlay = document.getElementById('errorOverlay');
    const errorIcon = document.getElementById('errorIcon');
    const errorTitle = document.getElementById('errorTitle');
    const errorContent = document.getElementById('errorContent');
    const errorButtons = document.getElementById('errorButtons');

    // ============================================================
    // LOGGING
    // ============================================================
    function addLog(type, message, data) {
        const entry = {
            type: type,
            message: message,
            data: data || null,
            timestamp: new Date().toISOString()
        };
        state.errorLog.push(entry);
        console.log(`[${type.toUpperCase()}]`, message, data || '');
    }

    // ============================================================
    // SHOW ERROR - CHI TIẾT TỪNG BƯỚC
    // ============================================================
    function showDetailedError(title, icon, sections) {
        errorIcon.textContent = icon || '❌';
        errorTitle.textContent = title || 'Lỗi';
        
        let html = '';
        
        // Render từng section
        for (const section of sections) {
            const statusClass = section.type === 'error' ? 'error-text' : 
                               section.type === 'success' ? 'success-text' : '';
            const borderClass = section.type === 'error' ? '' : 
                               section.type === 'success' ? 'success' : 
                               section.type === 'warning' ? 'warning' : '';
            
            html += `
                <div class="error-detail ${borderClass}">
                    <div class="label">${section.label || '📌'}</div>
                    <div class="value ${statusClass}">${section.value || 'Không có dữ liệu'}</div>
                    ${section.extra ? `<div style="font-size:11px;color:#666;margin-top:4px;">${section.extra}</div>` : ''}
                </div>
            `;
        }
        
        errorContent.innerHTML = html;
        errorOverlay.classList.remove('hidden');
        
        // Reset buttons
        errorButtons.innerHTML = `
            <button class="btn btn-primary" onclick="retryLoadPlugin()">🔄 Thử lại</button>
            <button class="btn btn-warning" onclick="openPanelAndPaste()">📋 Dán plugin thủ công</button>
            <button class="btn btn-secondary" onclick="showSystemInfo()">🖥️ Thông tin hệ thống</button>
            <button class="btn btn-danger" onclick="showPluginCode()">📄 Xem plugin code</button>
        `;
    }

    function closeError() {
        errorOverlay.classList.add('hidden');
    }

    // ============================================================
    // HLS PLAYER
    // ============================================================
    let hls = null;

    function initHls(url) {
        addLog('info', 'Init HLS', url);
        debugInfo.textContent = '📡 Stream: ' + url;
        
        if (hls) {
            hls.destroy();
            hls = null;
        }
        video.pause();
        video.removeAttribute('src');

        playerStatus.classList.remove('hidden');

        if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.play().catch(() => {});
            playerStatus.classList.add('hidden');
            return;
        }

        if (typeof Hls !== 'undefined' && Hls.isSupported()) {
            try {
                hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    backbufferLength: 30,
                    maxBufferLength: 30,
                    xhrSetup: function(xhr, url) {
                        xhr.withCredentials = false;
                        if (state.corsEnabled && state.corsOrigin) {
                            xhr.setRequestHeader('Origin', state.corsOrigin);
                        }
                        xhr.setRequestHeader('Referer', 'https://123av.com/');
                        xhr.setRequestHeader('User-Agent', 'Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:154.0) Gecko/20100101 Firefox/154.0');
                    }
                });

                hls.loadSource(url);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(() => {});
                    playerStatus.classList.add('hidden');
                });

                hls.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        console.error('HLS fatal error:', data);
                        playerStatus.classList.add('hidden');
                    }
                });

            } catch (e) {
                console.error('HLS init error:', e);
                playerStatus.classList.add('hidden');
                showDetailedError(
                    '❌ Lỗi HLS',
                    '❌',
                    [
                        { label: '📌 Trạng thái', value: 'Không thể khởi tạo HLS player', type: 'error' },
                        { label: '⚠️ Chi tiết', value: e.message, type: 'error' },
                        { label: '📋 Stack', value: e.stack || 'Không có stack', type: 'error' }
                    ]
                );
            }

        } else {
            playerStatus.classList.add('hidden');
            showDetailedError(
                '❌ HLS không hỗ trợ',
                '❌',
                [
                    { label: '📌 Trạng thái', value: 'Trình duyệt không hỗ trợ HLS', type: 'error' },
                    { label: '💡 Gợi ý', value: 'Vui lòng sử dụng Chrome, Firefox hoặc Edge mới nhất', type: 'warning' }
                ]
            );
        }
    }

    // ============================================================
    // FETCH
    // ============================================================
    async function fetchPage(url) {
        addLog('info', 'Fetch page', url);
        const headers = {
            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:154.0) Gecko/20100101 Firefox/154.0',
            'Referer': 'https://123av.com/',
            'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
            'Accept-Language': 'vi,en;q=0.9',
        };
        
        if (state.corsEnabled && state.corsOrigin) {
            headers['Origin'] = state.corsOrigin;
        }

        const response = await fetch(url, { headers });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.text();
    }

    // ============================================================
    // PLUGIN LOADER - VỚI DEBUG CHI TIẾT
    // ============================================================
    function loadPlugin() {
        try {
            const code = pluginCode.value.trim();
            if (!code) {
                showDetailedError(
                    '❌ Plugin code trống',
                    '❌',
                    [
                        { label: '📌 Trạng thái', value: 'Không có code để nạp', type: 'error' },
                        { label: '💡 Gợi ý', value: 'Vui lòng dán plugin code vào textarea hoặc tải từ file', type: 'warning' }
                    ]
                );
                return;
            }

            pluginStatus.textContent = '⏳ Đang nạp...';
            pluginStatus.className = 'plugin-status loading';
            addLog('info', 'Loading plugin', 'Code length: ' + code.length);

            // ============================================================
            // BƯỚC 1: Kiểm tra syntax cơ bản
            // ============================================================
            try {
                new Function(code);
                addLog('success', 'Plugin syntax OK');
            } catch (syntaxError) {
                addLog('error', 'Plugin syntax error', syntaxError.message);
                showDetailedError(
                    '❌ Lỗi syntax plugin',
                    '❌',
                    [
                        { label: '📌 Trạng thái', value: 'Plugin có lỗi cú pháp JavaScript', type: 'error' },
                        { label: '⚠️ Chi tiết', value: syntaxError.message, type: 'error' },
                        { label: '📍 Vị trí', value: `Line ${syntaxError.lineNumber || '?'}, Column ${syntaxError.columnNumber || '?'}`, type: 'error' },
                        { label: '💡 Gợi ý', value: 'Kiểm tra dấu ngoặc, dấu chấm phẩy, hoặc từ khóa không hợp lệ', type: 'warning' }
                    ]
                );
                pluginStatus.textContent = '❌ Lỗi syntax';
                pluginStatus.className = 'plugin-status error';
                return;
            }

            // ============================================================
            // BƯỚC 2: Kiểm tra dependency (jQuery)
            // ============================================================
            const usesJQuery = code.includes('$(') || code.includes('.$') || 
                               code.includes('jQuery') || code.includes('_$');
            
            if (usesJQuery && typeof $ === 'undefined') {
                addLog('error', 'jQuery not found but plugin uses it');
                showDetailedError(
                    '❌ Thiếu jQuery',
                    '❌',
                    [
                        { label: '📌 Trạng thái', value: 'Plugin sử dụng jQuery nhưng chưa được tải', type: 'error' },
                        { label: '🔍 Phát hiện', value: 'Plugin có sử dụng $, .$, jQuery hoặc _$', type: 'warning' },
                        { label: '💡 Gợi ý', value: 'Kiểm tra CDN jQuery hoặc sửa plugin để không dùng jQuery', type: 'warning' }
                    ]
                );
                pluginStatus.textContent = '❌ Thiếu jQuery';
                pluginStatus.className = 'plugin-status error';
                return;
            }

            if (usesJQuery) {
                addLog('info', 'Plugin uses jQuery', 'jQuery v' + $.fn.jquery);
            }

            // ============================================================
            // BƯỚC 3: Tìm và kiểm tra _$ trong code
            // ============================================================
            const usesUnderscoreDollar = code.includes('_$');
            if (usesUnderscoreDollar) {
                addLog('warn', 'Plugin uses _$ variable', 'This may cause error if not defined');
                
                // Kiểm tra xem _$ có được định nghĩa trong plugin không
                const definedInPlugin = code.includes('var _$') || code.includes('let _$') || code.includes('const _$');
                if (!definedInPlugin) {
                    addLog('error', '_$ is used but not defined in plugin');
                    showDetailedError(
                        '❌ Lỗi: _$ is not defined',
                        '❌',
                        [
                            { label: '📌 Trạng thái', value: 'Plugin sử dụng biến _$ nhưng không định nghĩa', type: 'error' },
                            { label: '🔍 Chi tiết', value: 'Biến _$ được sử dụng trong plugin nhưng chưa được khai báo', type: 'error' },
                            { label: '📍 Vị trí', value: 'Hàm parseListResponse', type: 'error' },
                            { label: '💡 Giải pháp', value: '1. Thêm var _$ = window.$ || jQuery; vào đầu plugin\n2. Hoặc sửa plugin để dùng $ thay vì _$', type: 'warning' }
                        ]
                    );
                    pluginStatus.textContent = '❌ Lỗi: _$ is not defined';
                    pluginStatus.className = 'plugin-status error';
                    return;
                }
            }

            // ============================================================
            // BƯỚC 4: Nạp plugin
            // ============================================================
            try {
                // Tạo sandbox với các biến cần thiết
                const sandbox = {
                    '$': typeof $ !== 'undefined' ? $ : undefined,
                    'jQuery': typeof jQuery !== 'undefined' ? jQuery : undefined,
                    '_$': typeof $ !== 'undefined' ? $ : undefined, // Tạo _$ từ $ để tránh lỗi
                };

                // Wrap code để inject _$ nếu cần
                let wrappedCode = code;
                if (usesUnderscoreDollar && !code.includes('var _$') && !code.includes('let _$') && !code.includes('const _$')) {
                    wrappedCode = 'var _$ = window.$ || jQuery || {};\n' + code;
                    addLog('info', 'Injected _$ = $ into plugin');
                }

                const fn = new Function(
                    'getManifest',
                    'getHomeSections',
                    'getPrimaryCategories',
                    'getFilterConfig',
                    'getUrlList',
                    'getUrlSearch',
                    'getUrlDetail',
                    'getUrlCategories',
                    'getUrlCountries',
                    'getUrlYears',
                    'parseListResponse',
                    'parseSearchResponse',
                    'parseMovieDetail',
                    'parseDetailResponse',
                    'parseCategoriesResponse',
                    'parseCountriesResponse',
                    'parseYearsResponse',
                    wrappedCode + '\nreturn { getManifest, getHomeSections, getPrimaryCategories, getFilterConfig, getUrlList, getUrlSearch, getUrlDetail, getUrlCategories, getUrlCountries, getUrlYears, parseListResponse, parseSearchResponse, parseMovieDetail, parseDetailResponse, parseCategoriesResponse, parseCountriesResponse, parseYearsResponse };'
                );

                const plugin = fn();

                // Kiểm tra các hàm bắt buộc
                const required = ['getManifest', 'getHomeSections', 'getUrlList', 'getUrlSearch', 'getUrlDetail', 'parseListResponse', 'parseSearchResponse', 'parseMovieDetail', 'parseDetailResponse'];
                const missing = [];
                for (const key of required) {
                    if (typeof plugin[key] !== 'function') {
                        missing.push(key);
                    }
                }
                if (missing.length > 0) {
                    throw new Error(`Thiếu hàm bắt buộc: ${missing.join(', ')}`);
                }

                state.plugin = plugin;
                state.pluginLoaded = true;

                try {
                    const manifest = JSON.parse(plugin.getManifest());
                    pluginStatus.textContent = `✅ ${manifest.name} v${manifest.version}`;
                    pluginStatus.className = 'plugin-status loaded';
                    addLog('success', 'Plugin loaded', manifest);
                } catch (e) {
                    pluginStatus.textContent = '✅ Đã tải';
                    pluginStatus.className = 'plugin-status loaded';
                    addLog('warn', 'Plugin loaded but manifest parse failed', e.message);
                }

                closeError();
                loadSections();
                loadHome();

            } catch (e) {
                addLog('error', 'Plugin load error', e.message);
                pluginStatus.textContent = '❌ Lỗi: ' + e.message;
                pluginStatus.className = 'plugin-status error';
                state.pluginLoaded = false;
                
                showDetailedError(
                    '❌ Lỗi nạp plugin',
                    '❌',
                    [
                        { label: '📌 Trạng thái', value: 'Không thể nạp plugin', type: 'error' },
                        { label: '⚠️ Chi tiết', value: e.message, type: 'error' },
                        { label: '📋 Stack', value: e.stack || 'Không có stack trace', type: 'error' },
                        { label: '💡 Gợi ý', value: 'Kiểm tra lại code plugin, đặc biệt là các hàm bắt buộc', type: 'warning' }
                    ]
                );
            }

        } catch (e) {
            addLog('error', 'Unexpected error', e.message);
            pluginStatus.textContent = '❌ Lỗi: ' + e.message;
            pluginStatus.className = 'plugin-status error';
            state.pluginLoaded = false;
            
            showDetailedError(
                '❌ Lỗi không xác định',
                '❌',
                [
                    { label: '📌 Trạng thái', value: 'Lỗi không xác định khi nạp plugin', type: 'error' },
                    { label: '⚠️ Chi tiết', value: e.message, type: 'error' },
                    { label: '📋 Stack', value: e.stack || 'Không có stack trace', type: 'error' }
                ]
            );
        }
    }

    function loadPluginFromFile() {
        pluginStatus.textContent = '⏳ Đang tải từ file...';

        addLog('info', 'Loading plugin from file', '123av-plugin.js');

        fetch('123av-plugin.js')
            .then(res => {
                if (!res.ok) {
                    throw new Error(`HTTP ${res.status} - ${res.statusText}`);
                }
                return res.text();
            })
            .then(code => {
                if (!code.trim()) {
                    throw new Error('File plugin trống (0 bytes)');
                }
                addLog('success', 'Plugin file loaded', code.length + ' bytes');
                pluginCode.value = code;
                loadPlugin();

    // ============================================================
    // SHOW PLUGIN CODE
    // ============================================================
    function showPluginCode() {
        const code = pluginCode.value.trim();
        if (!code) {
            showDetailedError(
                '📄 Plugin code trống',
                '📄',
                [
                    { label: '📌 Trạng thái', value: 'Chưa có plugin code trong textarea', type: 'warning' },
                    { label: '💡 Gợi ý', value: 'Tải plugin từ file hoặc dán code vào', type: 'warning' }
                ]
            );
            return;
        }

        // Đếm số dòng và ký tự
        const lines = code.split('\n');
        const lineCount = lines.length;
        const charCount = code.length;
        
        // Tìm các từ khóa đáng chú ý
        const hasJQuery = code.includes('$(') || code.includes('.$');
        const hasUnderscoreDollar = code.includes('_$');
        const hasAjax = code.includes('$.ajax') || code.includes('.ajax');
        const hasGet = code.includes('$.get') || code.includes('.get');
        
        let analysis = `📊 Phân tích code:\n`;
        analysis += `- Số dòng: ${lineCount}\n`;
        analysis += `- Số ký tự: ${charCount}\n`;
        analysis += `- Sử dụng jQuery: ${hasJQuery ? '✅ Có' : '❌ Không'}\n`;
        analysis += `- Sử dụng _`: ${hasUnderscoreDollar ? '⚠️ CÓ (có thể gây lỗi)' : '✅ Không'}\n`;
        analysis += `- Sử dụng $.ajax: ${hasAjax ? '✅ Có' : '❌ Không'}\n`;
        analysis += `- Sử dụng $.get: ${hasGet ? '✅ Có' : '❌ Không'}\n`;

        // Hiển thị 50 dòng đầu
        const previewLines = lines.slice(0, 50).map((l, i) => `${String(i+1).padStart(4, ' ')}: ${l}`).join('\n');
        const moreLines = lineCount > 50 ? `\n... và ${lineCount - 50} dòng nữa` : '';

        showDetailedError(
            `📄 Plugin code (${lineCount} dòng)`,
            '📄',
            [
                { label: '📊 Phân tích', value: analysis, type: 'info' },
                { label: '📝 Preview (50 dòng đầu)', value: previewLines + moreLines, type: 'info' }
            ]
        );
        
        // Thêm nút copy
        const copyBtn = document.createElement('button');
        copyBtn.className = 'btn btn-secondary';
        copyBtn.textContent = '📋 Copy toàn bộ code';
        copyBtn.onclick = function() {
            navigator.clipboard.writeText(code).then(() => {
                alert('✅ Đã copy plugin code vào clipboard!');
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = code;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert('✅ Đã copy plugin code vào clipboard!');
            });
        };
        document.querySelector('#errorButtons .btn-group').appendChild(copyBtn);
    }

    // ============================================================
    // LOAD SECTION / LIST - CÓ BẮT LỖI CHI TIẾT
    // ============================================================
    function loadSection(slug, page) {
        if (!state.pluginLoaded || !state.plugin) {
            showDetailedError(
                'Plugin chưa được nạp!',
                '❌',
                [
                    { label: '📌 Trạng thái', value: 'Không thể load section', type: 'error' },
                    { label: '💡 Gợi ý', value: 'Vui lòng nạp plugin trước', type: 'warning' }
                ]
            );
            return;
        }

        state.currentSlug = slug;
        state.currentPage = page || 1;

        try {
            const filters = { ...state.filters, page: state.currentPage };
            const url = state.plugin.getUrlList(slug, JSON.stringify(filters));
            addLog('info', 'Loading section', url);

            fetchPage(url)
                .then(html => {
                    try {
                        const result = JSON.parse(state.plugin.parseListResponse(html));
                        renderMovies(result.items);
                        renderPagination(result.pagination);
                        addLog('success', 'Section loaded', result.items.length + ' items');
                    } catch (parseError) {
                        addLog('error', 'Parse list response error', parseError.message);
                        showDetailedError(
                            '❌ Lỗi parse dữ liệu',
                            '❌',
                            [
                                { label: '📌 Trạng thái', value: 'Không thể parse response từ plugin', type: 'error' },
                                { label: '⚠️ Chi tiết', value: parseError.message, type: 'error' },
                                { label: '📋 Stack', value: parseError.stack || 'Không có stack', type: 'error' },
                                { label: '💡 Gợi ý', value: 'Kiểm tra hàm parseListResponse trong plugin', type: 'warning' }
                            ]
                        );
                        movieGrid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:#e74c3c; padding:40px 0;">❌ Lỗi parse: ${parseError.message}</div>`;
                    }
                })
                .catch(err => {
                    addLog('error', 'Fetch error', err.message);
                    movieGrid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:#e74c3c; padding:40px 0;">❌ Lỗi tải dữ liệu: ${err.message}</div>`;
                    showDetailedError(
                        '❌ Lỗi tải dữ liệu',
                        '❌',
                        [
                            { label: '📌 Trạng thái', value: 'Không thể tải dữ liệu từ server', type: 'error' },
                            { label: '⚠️ Chi tiết', value: err.message, type: 'error' },
                            { label: '📋 Stack', value: err.stack || 'Không có stack', type: 'error' },
                            { label: '💡 Gợi ý', value: 'Kiểm tra URL và kết nối mạng', type: 'warning' }
                        ]
                    );
                });

        } catch (e) {
            addLog('error', 'Load section error', e.message);
            movieGrid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:#e74c3c; padding:40px 0;">❌ Lỗi: ${e.message}</div>`;
            showDetailedError(
                '❌ Lỗi load section',
                '❌',
                [
                    { label: '📌 Trạng thái', value: 'Lỗi khi load section', type: 'error' },
                    { label: '⚠️ Chi tiết', value: e.message, type: 'error' },
                    { label: '📋 Stack', value: e.stack || 'Không có stack', type: 'error' }
                ]
            );
        }
    }

    function loadHome() {
        if (!state.pluginLoaded || !state.plugin) {
            showDetailedError(
                'Plugin chưa được nạp!',
                '❌',
                [
                    { label: '📌 Trạng thái', value: 'Không thể load home', type: 'error' },
                    { label: '💡 Gợi ý', value: 'Vui lòng nạp plugin trước', type: 'warning' }
                ]
            );
            return;
        }
        if (state.sections.length > 0) {
            loadSection(state.sections[0].slug);
        } else {
            loadSection('vi/new');
        }
    }

    // ============================================================
    // SEARCH
    // ============================================================
    function doSearch() {
        if (!state.pluginLoaded || !state.plugin) {
            showDetailedError(
                'Plugin chưa được nạp!',
                '❌',
                [
                    { label: '📌 Trạng thái', value: 'Không thể tìm kiếm', type: 'error' },
                    { label: '💡 Gợi ý', value: 'Vui lòng nạp plugin trước', type: 'warning' }
                ]
            );
            return;
        }
        const keyword = searchInput.value.trim();
        if (!keyword) { loadHome(); return; }

        try {
            const filters = { ...state.filters, page: 1 };
            const url = state.plugin.getUrlSearch(keyword, JSON.stringify(filters));
            addLog('info', 'Searching', url);

            fetchPage(url)
                .then(html => {
                    try {
                        const result = JSON.parse(state.plugin.parseSearchResponse(html));
                        renderMovies(result.items);
                        renderPagination(result.pagination);
                        state.currentSlug = 'search';
                        state.currentPage = 1;
                        addLog('success', 'Search completed', result.items.length + ' results');
                    } catch (parseError) {
                        addLog('error', 'Parse search error', parseError.message);
                        showDetailedError(
                            '❌ Lỗi parse kết quả tìm kiếm',
                            '❌',
                            [
                                { label: '📌 Trạng thái', value: 'Không thể parse kết quả tìm kiếm', type: 'error' },
                                { label: '⚠️ Chi tiết', value: parseError.message, type: 'error' },
                                { label: '💡 Gợi ý', value: 'Kiểm tra hàm parseSearchResponse trong plugin', type: 'warning' }
                            ]
                        );
                    }
                })
                .catch(err => {
                    addLog('error', 'Search error', err.message);
                    movieGrid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:#e74c3c; padding:40px 0;">❌ Lỗi tìm kiếm: ${err.message}</div>`;
                });

        } catch (e) {
            addLog('error', 'Search error', e.message);
            showDetailedError(
                '❌ Lỗi tìm kiếm',
                '❌',
                [
                    { label: '📌 Trạng thái', value: 'Lỗi khi tìm kiếm', type: 'error' },
                    { label: '⚠️ Chi tiết', value: e.message, type: 'error' },
                    { label: '📋 Stack', value: e.stack || 'Không có stack', type: 'error' }
                ]
            );
        }
    }

    // ============================================================
    // PLAY MOVIE
    // ============================================================
    function playMovie(slug) {
        if (!state.pluginLoaded || !state.plugin) {
            showDetailedError(
                'Plugin chưa được nạp!',
                '❌',
                [
                    { label: '📌 Trạng thái', value: 'Không thể phát phim', type: 'error' },
                    { label: '💡 Gợi ý', value: 'Vui lòng nạp plugin trước', type: 'warning' }
                ]
            );
            return;
        }

        playerStatus.classList.remove('hidden');
        videoTitle.textContent = '⏳ Đang tải thông tin phim...';
        debugInfo.textContent = '📡 Đang lấy thông tin...';

        try {
            const url = state.plugin.getUrlDetail(slug);
            addLog('info', 'Playing movie', url);
            debugInfo.textContent = '📡 Đang tải: ' + url;

            fetchPage(url)
                .then(html => {
                    let detail = null;
                    try {
                        const detailStr = state.plugin.parseMovieDetail(html);
                        if (detailStr && detailStr !== "null") {
                            detail = JSON.parse(detailStr);
                        }
                    } catch (e) {
                        addLog('warn', 'Parse detail error', e.message);
                    }

                    if (detail) {
                        videoTitle.textContent = detail.title || 'Không có tiêu đề';
                        videoMeta.innerHTML = `
                            <span>🎥 Chất lượng: ${detail.quality || 'HD'}</span>
                            <span>📅 Năm: ${detail.year || '--'}</span>
                            <span>🎭 ${detail.category || '--'}</span>
                            <span>👤 ${detail.casts || '--'}</span>
                        `;
                    }

                    let streamUrl = null;

                    const m3u8Matches = html.match(/https?:\/\/[^\s"'<>]+\.m3u8[^\s"'<>]*/gi);
                    if (m3u8Matches && m3u8Matches.length > 0) {
                        streamUrl = m3u8Matches[0];
                        debugInfo.textContent = '📡 Tìm thấy m3u8 trực tiếp';
                        initHls(streamUrl);
                        return;
                    }

                    if (detail && detail.servers && detail.servers.length > 0) {
                        const server = detail.servers[0];
                        if (server.episodes && server.episodes.length > 0) {
                            const ep = server.episodes[0];
                            let epUrl = ep.id;
                            debugInfo.textContent = '📡 Lấy stream từ detail.servers: ' + epUrl;

                            if (epUrl && epUrl.includes('.m3u8')) {
                                initHls(epUrl);
                                return;
                            }

                            if (epUrl) {
                                debugInfo.textContent = '📡 Fetch stream URL: ' + epUrl;
                                const headers = {
                                    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:154.0) Gecko/20100101 Firefox/154.0',
                                    'Referer': 'https://123av.com/',
                                    'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
                                };
                                if (state.corsEnabled && state.corsOrigin) {
                                    headers['Origin'] = state.corsOrigin;
                                }
                                fetch(epUrl, { headers })
                                .then(res => res.text())
                                .then(body => {
                                    const innerM3u8 = body.match(/https?:\/\/[^\s"'<>]+\.m3u8[^\s"'<>]*/gi);
                                    if (innerM3u8 && innerM3u8.length > 0) {
                                        initHls(innerM3u8[0]);
                                    } else {
                                        playerStatus.classList.add('hidden');
                                        alert('Không tìm thấy stream trong URL của episode.');
                                    }
                                })
                                .catch(err => {
                                    console.error('Fetch episode error:', err);
                                    playerStatus.classList.add('hidden');
                                    alert('Lỗi khi tải stream: ' + err.message);
                                });
                                return;
                            }
                        }
                    }

                    const playerMatch = html.match(/player\(\s*JSON\.parse\(\s*['"]([^'"]+)['"]\s*\)/i);
                    if (playerMatch) {
                        try {
                            const cleanStr = playerMatch[1]
                                .replace(/\\u([0-9a-fA-F]{4})/g, (m, g) => String.fromCharCode(parseInt(g, 16)))
                                .replace(/\\/g, '');
                            const playerData = JSON.parse(cleanStr);
                            
                            if (Array.isArray(playerData) && playerData.length > 0) {
                                const item = playerData[0];
                                if (item.url) {
                                    if (item.url.includes('.m3u8')) {
                                        initHls(item.url);
                                        return;
                                    } else {
                                        debugInfo.textContent = '📡 Fetch player URL: ' + item.url;
                                        const headers = {
                                            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:154.0) Gecko/20100101 Firefox/154.0',
                                            'Referer': 'https://123av.com/',
                                            'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
                                        };
                                        if (state.corsEnabled && state.corsOrigin) {
                                            headers['Origin'] = state.corsOrigin;
                                        }
                                        fetch(item.url, { headers })
                                        .then(res => res.text())
                                        .then(body => {
                                            const innerM3u8 = body.match(/https?:\/\/[^\s"'<>]+\.m3u8[^\s"'<>]*/gi);
                                            if (innerM3u8 && innerM3u8.length > 0) {
                                                initHls(innerM3u8[0]);
                                            } else {
                                                playerStatus.classList.add('hidden');
                                                alert('Không tìm thấy stream trong player URL.');
                                            }
                                        })
                                        .catch(err => {
                                            playerStatus.classList.add('hidden');
                                            alert('Lỗi fetch player URL: ' + err.message);
                                        });
                                        return;
                                    }
                                }
                            }
                        } catch (e) {
                            console.warn('Parse player data error:', e);
                        }
                    }

                    playerStatus.classList.add('hidden');
                    alert('Không tìm thấy stream HLS (m3u8).');

                })
                .catch(err => {
                    console.error('Play error:', err);
                    playerStatus.classList.add('hidden');
                    alert('Lỗi tải phim: ' + err.message);
                    showDetailedError(
                        '❌ Lỗi phát phim',
                        '❌',
                        [
                            { label: '📌 Trạng thái', value: 'Lỗi khi tải phim', type: 'error' },
                            { label: '⚠️ Chi tiết', value: err.message, type: 'error' },
                            { label: '📋 Stack', value: err.stack || 'Không có stack', type: 'error' }
                        ]
                    );
                });

        } catch (e) {
            console.error('Play error:', e);
            playerStatus.classList.add('hidden');
            alert('Lỗi: ' + e.message);
            showDetailedError(
                '❌ Lỗi phát phim',
                '❌',
                [
                    { label: '📌 Trạng thái', value: 'Lỗi khi phát phim', type: 'error' },
                    { label: '⚠️ Chi tiết', value: e.message, type: 'error' },
                    { label: '📋 Stack', value: e.stack || 'Không có stack', type: 'error' }
                ]
            );
        }
    }

    // ============================================================
    // PLAY CUSTOM URL
    // ============================================================
    function playCustomUrl() {
        if (!state.pluginLoaded || !state.plugin) {
            showDetailedError(
                'Plugin chưa được nạp!',
                '❌',
                [
                    { label: '📌 Trạng thái', value: 'Không thể phát URL', type: 'error' },
                    { label: '💡 Gợi ý', value: 'Vui lòng nạp plugin trước', type: 'warning' }
                ]
            );
            return;
        }
        const url = document.getElementById('customUrl').value.trim();
        if (!url) { alert('Vui lòng nhập URL'); return; }
        
        if (url.includes('.m3u8')) {
            initHls(url);
            return;
        }

        const slugMatch = url.match(/\/v\/([^/?]+)/);
        if (slugMatch) {
            playMovie('vi/v/' + slugMatch[1]);
        } else {
            playerStatus.classList.remove('hidden');
            debugInfo.textContent = '📡 Đang tải: ' + url;
            const headers = {
                'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:154.0) Gecko/20100101 Firefox/154.0',
                'Referer': 'https://123av.com/',
                'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
            };
            if (state.corsEnabled && state.corsOrigin) {
                headers['Origin'] = state.corsOrigin;
            }
            fetch(url, { headers })
            .then(res => res.text())
            .then(html => {
                const m3u8Match = html.match(/https?:\/\/[^\s"'<>]+\.m3u8[^\s"'<>]*/i);
                if (m3u8Match) {
                    initHls(m3u8Match[0]);
                } else {
                    playerStatus.classList.add('hidden');
                    alert('Không tìm thấy stream HLS tại URL này.');
                }
            })
            .catch(err => {
                playerStatus.classList.add('hidden');
                alert('Lỗi tải URL: ' + err.message);
            });
        }
    }

    // ============================================================
    // RENDER
    // ============================================================
    function renderMovies(items) {
        if (!items || items.length === 0) {
            movieGrid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:#666; padding:40px 0;">📭 Không có kết quả</div>`;
            return;
        }

        movieGrid.innerHTML = items.map(item => `
            <div class="movie-card" onclick="playMovie('${item.id}')">
                <img class="thumb" src="${item.posterUrl || ''}" alt="${item.title}" 
                     onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22300%22%3E%3Crect fill=%22%231a1a2e%22 width=%22200%22 height=%22300%22/%3E%3Ctext x=%2250%%22 y=%2250%%22 text-anchor=%22middle%22 fill=%22%23666%22 font-size=%2214%22 font-family=%22sans-serif%22%3E📸%3C/text%3E%3C/svg%3E'" />
                <div class="info">
                    <div class="title">${item.title || 'Không tên'}</div>
                    <div class="sub">${item.episode_current || ''} ${item.quality || ''}</div>
                </div>
            </div>
        `).join('');
    }

    function renderPagination(paginationData) {
        if (!paginationData || paginationData.totalPages <= 1) {
            pagination.innerHTML = '';
            return;
        }

        const current = paginationData.currentPage || 1;
        const total = paginationData.totalPages || 1;

        let html = '';
        if (current > 1) {
            html += `<button class="page-btn" onclick="goToPage(${current - 1})">◀</button>`;
        }

        const start = Math.max(1, current - 2);
        const end = Math.min(total, current + 2);

        if (start > 1) {
            html += `<button class="page-btn" onclick="goToPage(1)">1</button>`;
            if (start > 2) html += `<span class="page-btn" style="border:none;background:transparent;">...</span>`;
        }

        for (let i = start; i <= end; i++) {
            html += `<button class="page-btn ${i === current ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
        }

        if (end < total) {
            if (end < total - 1) html += `<span class="page-btn" style="border:none;background:transparent;">...</span>`;
            html += `<button class="page-btn" onclick="goToPage(${total})">${total}</button>`;
        }

        if (current < total) {
            html += `<button class="page-btn" onclick="goToPage(${current + 1})">▶</button>`;
        }

        pagination.innerHTML = html;
    }

    function goToPage(page) {
        if (state.currentSlug === 'search') {
            doSearch();
        } else {
            loadSection(state.currentSlug, page);
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ============================================================
    // PANEL TOGGLE
    // ============================================================
    function togglePanel() {
        const content = document.getElementById('panelContent');
        const arrow = document.getElementById('panelArrow');
        content.classList.toggle('open');
        arrow.classList.toggle('open');
    }

    // ============================================================
    // KEYBOARD SHORTCUTS
    // ============================================================
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && document.activeElement === searchInput) {
            doSearch();
        }
        if (e.key === 'Escape') {
            closeError();
        }
    });

    // ============================================================
    // INIT
    // ============================================================
    window.onload = function() {
        addLog('info', 'Page loaded');
        updateCorsStatus();
        
        if (typeof $ === 'undefined') {
            addLog('error', 'jQuery not loaded');
            showDetailedError(
                '⚠️ jQuery chưa được tải',
                '⚠️',
                [
                    { label: '📌 Trạng thái', value: 'jQuery không được tải', type: 'error' },
                    { label: '💡 Gợi ý', value: 'Kiểm tra kết nối CDN hoặc tải jQuery từ file local', type: 'warning' }
                ]
            );
            return;
        }
        addLog('success', 'jQuery loaded', 'v' + $.fn.jquery);
        
        if (typeof Hls === 'undefined') {
            addLog('error', 'HLS.js not loaded');
            showDetailedError(
                '⚠️ HLS.js chưa được tải',
                '⚠️',
                [
                    { label: '📌 Trạng thái', value: 'HLS.js không được tải', type: 'error' },
                    { label: '💡 Gợi ý', value: 'Kiểm tra kết nối CDN hoặc tải HLS.js từ file local', type: 'warning' }
                ]
            );
            return;
        }
        addLog('success', 'HLS.js loaded', 'v' + (Hls.version || 'unknown'));
        
        loadPluginFromFile();
    };

    // ============================================================
    // GLOBAL ERROR HANDLER
    // ============================================================
    window.onerror = function(message, source, lineno, colno, error) {
        addLog('error', 'Global error', message);
        
        // Hiển thị lỗi chi tiết nếu là lỗi _$ 
        if (message.includes('_$ is not defined')) {
            showDetailedError(
                '❌ Lỗi: _$ is not defined',
                '❌',
                [
                    { label: '📌 Trạng thái', value: 'Plugin sử dụng biến _$ nhưng không được định nghĩa', type: 'error' },
                    { label: '🔍 Nguyên nhân', value: 'Hàm parseListResponse trong plugin sử dụng _$ nhưng chưa khai báo', type: 'error' },
                    { label: '📍 Vị trí', value: `File: ${source || 'unknown'}\nDòng: ${lineno || '?'}, Cột: ${colno || '?'}`, type: 'error' },
                    { label: '💡 Giải pháp', value: '1. Thêm var _$ = window.$ || jQuery; vào đầu plugin\n2. Hoặc sửa plugin để dùng $ thay vì _$', type: 'warning' },
                    { label: '📋 Stack', value: error ? error.stack : 'Không có stack trace', type: 'error' }
                ]
            );
        }
        return false;
    };
</script>
