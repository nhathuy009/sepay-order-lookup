name: Hello World

on:
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Python version
        run: python --version

      - name: Pip version
        run: pip --version

      - name: Node version
        run: node --version

      - name: NPM version
        run: npm --version

      - name: Git version
        run: git --version
