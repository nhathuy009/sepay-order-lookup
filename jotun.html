<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Trộn màu sơn · Mixbox</title>
<script src="https://scrtwpns.com/mixbox.js"></script>
<style>
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f4f4f5;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
    color: #222;
  }
  h1 { font-size: 20px; margin-bottom: 8px; }
  .subtitle { font-size: 12px; color: #777; margin-bottom: 20px; }
  .wrap {
    display: flex;
    gap: 32px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 960px;
  }
  .controls {
    display: grid;
    grid-template-columns: repeat(5, 88px);
    gap: 14px;
  }
  .col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .col label { font-size: 12px; font-weight: 600; text-align: center; line-height: 1.25; }
  .col input[type=range] {
    writing-mode: vertical-lr;
    direction: rtl;
    width: 24px;
    height: 160px;
    cursor: pointer;
  }
  .col .val { font-size: 12px; color: #555; }
  .preview {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .swatch {
    width: 160px;
    height: 160px;
    border-radius: 12px;
    border: 1px solid #ccc;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .codes {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: stretch;
  }
  .code-row {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .code-row input {
    font-family: monospace;
    font-size: 13px;
    padding: 4px 6px;
    border: 1px solid #ccc;
    border-radius: 6px;
    width: 130px;
  }
  .code-row button {
    font-size: 12px;
    padding: 4px 8px;
    border: 1px solid #ccc;
    background: #fff;
    border-radius: 6px;
    cursor: pointer;
  }
  .code-row button:hover { background: #eee; }
  .hex-hint {
    font-size: 11px;
    color: #666;
    min-height: 16px;
    text-align: center;
    line-height: 1.3;
  }
  .hex-hint.ok { color: #2a7a2a; }
  .hex-hint.err { color: #b33; }
  .reset-btn {
    margin-top: 8px;
    font-size: 12px;
    padding: 6px 12px;
    border: 1px solid #ccc;
    background: #fff;
    border-radius: 6px;
    cursor: pointer;
  }
  .reset-btn:hover { background: #eee; }
  .match {
    width: 100%;
    max-width: 700px;
    margin-top: 8px;
  }
  .match-title {
    font-size: 13px;
    font-weight: 600;
    color: #555;
    margin-bottom: 8px;
    text-align: center;
  }
  .match-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 12px 16px;
  }
  .match-swatch {
    width: 56px;
    height: 56px;
    border-radius: 8px;
    border: 1px solid #ccc;
    flex-shrink: 0;
  }
  .match-name { font-size: 15px; font-weight: 600; }
  .match-code { font-size: 12px; color: #666; margin-top: 2px; }
  .match-delta { font-size: 11px; color: #999; margin-top: 4px; }
</style>
</head>
<body>

<h1>Trộn màu sơn</h1>
<div class="subtitle">Mixbox (Kubelka-Munk) · 5 sắc tố · Nhập mã hex</div>

<div class="wrap">
  <div class="controls">
    <div class="col">
      <label>Trắng → Đen</label>
      <input type="range" id="s-black" min="0" max="100" value="0">
      <span class="val" id="v-black">0%</span>
    </div>
    <div class="col">
      <label>Vàng</label>
      <input type="range" id="s-yellow" min="0" max="100" value="0">
      <span class="val" id="v-yellow">0%</span>
    </div>
    <div class="col">
      <label>Đỏ</label>
      <input type="range" id="s-red" min="0" max="100" value="0">
      <span class="val" id="v-red">0%</span>
    </div>
    <div class="col">
      <label>Xanh dương</label>
      <input type="range" id="s-blue" min="0" max="100" value="0">
      <span class="val" id="v-blue">0%</span>
    </div>
    <div class="col">
      <label>Xanh lá</label>
      <input type="range" id="s-green" min="0" max="100" value="0">
      <span class="val" id="v-green">0%</span>
    </div>
  </div>

  <div class="preview">
    <div class="swatch" id="swatch"></div>
    <div class="codes">
      <div class="code-row">
        <input type="text" id="hex-code" placeholder="#RRGGBB">
        <button data-copy="hex-code">Copy</button>
      </div>
      <div class="hex-hint" id="hex-hint"></div>
      <div class="code-row">
        <input type="text" id="rgb-code" readonly>
        <button data-copy="rgb-code">Copy</button>
      </div>
    </div>
    <button class="reset-btn" id="reset">Đặt lại</button>
  </div>

  <div class="match">
    <div class="match-title">Màu Jotun gần nhất</div>
    <div class="match-card">
      <div class="match-swatch" id="match-swatch"></div>
      <div class="match-info">
        <div class="match-name" id="match-name">—</div>
        <div class="match-code" id="match-code">—</div>
        <div class="match-delta" id="match-delta"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const sliders = {
    black:  document.getElementById('s-black'),
    yellow: document.getElementById('s-yellow'),
    red:    document.getElementById('s-red'),
    blue:   document.getElementById('s-blue'),
    green:  document.getElementById('s-green'),
  };
  const labels = {
    black:  document.getElementById('v-black'),
    yellow: document.getElementById('v-yellow'),
    red:    document.getElementById('v-red'),
    blue:   document.getElementById('v-blue'),
    green:  document.getElementById('v-green'),
  };
  const swatch = document.getElementById('swatch');
  const hexInput = document.getElementById('hex-code');
  const rgbInput = document.getElementById('rgb-code');
  const hexHint = document.getElementById('hex-hint');

  // ===== Mixbox (Kubelka-Munk) =====
  // 5 sắc tố gốc gần với pigment thật
  const PIGMENTS = {
    white:  "rgb(255, 255, 255)",
    black:  "rgb(25, 25, 25)",
    yellow: "rgb(252, 211, 0)",   // Hansa Yellow
    red:    "rgb(220, 40, 30)",   // Cadmium / Pyrrole Red
    blue:   "rgb(0, 33, 133)",    // Cobalt / Ultramarine
    green:  "rgb(0, 80, 55)",     // Phthalo Green
  };

  // Cache latent của từng pigment (tính 1 lần)
  const LATENT = {};
  function ensureLatents() {
    if (LATENT.white) return;
    for (const [k, v] of Object.entries(PIGMENTS)) {
      LATENT[k] = mixbox.rgbToLatent(v);
    }
  }

  function clamp(v) { return Math.max(0, Math.min(255, Math.round(v))); }

  function parseRgbResult(result) {
    // Mixbox.latentToRgb thường trả về mảng [r, g, b] (0-255)
    // Một số bản khác trả string "rgb(r, g, b)" hoặc object {r,g,b}
    if (Array.isArray(result) && result.length >= 3) {
      return { r: clamp(result[0]), g: clamp(result[1]), b: clamp(result[2]) };
    }
    if (typeof result === "string") {
      const m = result.match(/(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
      if (m) return { r: +m[1], g: +m[2], b: +m[3] };
    }
    if (result && typeof result === "object") {
      if ("r" in result) return { r: clamp(result.r), g: clamp(result.g), b: clamp(result.b) };
      // TypedArray / array-like
      if (result.length >= 3) return { r: clamp(result[0]), g: clamp(result[1]), b: clamp(result[2]) };
    }
    console.warn("Mixbox latentToRgb returned unexpected format:", result);
    return { r: 128, g: 128, b: 128 };
  }

  function computeFrom(vals) {
    ensureLatents();
    // vals: {black, yellow, red, blue, green} ∈ [0,1]
    // Trọng số: white = phần còn lại sau khi trừ các sắc tố
    const wBlack  = vals.black;
    const wYellow = vals.yellow;
    const wRed    = vals.red;
    const wBlue   = vals.blue;
    const wGreen  = vals.green;
    const sumColor = wBlack + wYellow + wRed + wBlue + wGreen;
    const wWhite = Math.max(0, 1 - sumColor);

    // Nếu tất cả = 0 → trắng tinh
    if (sumColor < 1e-6) {
      return { r: 255, g: 255, b: 255 };
    }

    // Trộn trong không gian latent của Mixbox
    const z = new Array(mixbox.LATENT_SIZE).fill(0);
    const add = (latent, w) => {
      if (w <= 0) return;
      for (let i = 0; i < z.length; i++) z[i] += latent[i] * w;
    };
    add(LATENT.white,  wWhite);
    add(LATENT.black,  wBlack);
    add(LATENT.yellow, wYellow);
    add(LATENT.red,    wRed);
    add(LATENT.blue,   wBlue);
    add(LATENT.green,  wGreen);

    // Chuẩn hóa (tổng trọng số có thể ≠ 1)
    const total = wWhite + sumColor;
    if (total > 1e-6) {
      for (let i = 0; i < z.length; i++) z[i] /= total;
    }

    const mixed = mixbox.latentToRgb(z);
    return parseRgbResult(mixed);
  }

  function compute() {
    return computeFrom({
      black:  sliders.black.value / 100,
      yellow: sliders.yellow.value / 100,
      red:    sliders.red.value / 100,
      blue:   sliders.blue.value / 100,
      green:  sliders.green.value / 100,
    });
  }

  function toHex(n) { return n.toString(16).padStart(2, '0'); }

  // ===== Đảo ngược RGB → 5 thanh trượt =====
  function reverseToSliders(tr, tg, tb) {
    let best = { black:0, yellow:0, red:0, blue:0, green:0, dist: Infinity };

    for (let bk = 0; bk <= 100; bk += 5) {
      for (let trial = 0; trial < 8; trial++) {
        let y  = Math.random();
        let rd = Math.random();
        let bl = Math.random();
        let gr = Math.random();

        // Coordinate descent vài vòng
        for (let iter = 0; iter < 5; iter++) {
          for (const key of ['y','rd','bl','gr']) {
            let bestLocal = key === 'y' ? y : key === 'rd' ? rd : key === 'bl' ? bl : gr;
            let bestD = Infinity;
            for (let d = -0.12; d <= 0.12; d += 0.04) {
              let ty=y, trd=rd, tbl=bl, tgr=gr;
              if (key === 'y')  ty  = Math.max(0, Math.min(1, y+d));
              if (key === 'rd') trd = Math.max(0, Math.min(1, rd+d));
              if (key === 'bl') tbl = Math.max(0, Math.min(1, bl+d));
              if (key === 'gr') tgr = Math.max(0, Math.min(1, gr+d));
              const col = computeFrom({black:bk/100, yellow:ty, red:trd, blue:tbl, green:tgr});
              const dist = Math.hypot(col.r-tr, col.g-tg, col.b-tb);
              if (dist < bestD) { bestD = dist; bestLocal = key==='y'?ty:key==='rd'?trd:key==='bl'?tbl:tgr; }
            }
            if (key === 'y')  y  = bestLocal;
            if (key === 'rd') rd = bestLocal;
            if (key === 'bl') bl = bestLocal;
            if (key === 'gr') gr = bestLocal;
          }
        }

        const col = computeFrom({black:bk/100, yellow:y, red:rd, blue:bl, green:gr});
        const dist = Math.hypot(col.r-tr, col.g-tg, col.b-tb);
        if (dist < best.dist) {
          best = {
            black: bk,
            yellow: Math.round(y*100),
            red:    Math.round(rd*100),
            blue:   Math.round(bl*100),
            green:  Math.round(gr*100),
            dist
          };
        }
      }
    }
    return best;
  }

  function parseHex(str) {
    if (!str) return null;
    str = str.trim().replace(/^#/, '').toUpperCase();
    if (/^[0-9A-F]{3}$/.test(str)) str = str[0]+str[0]+str[1]+str[1]+str[2]+str[2];
    if (!/^[0-9A-F]{6}$/.test(str)) return null;
    const n = parseInt(str, 16);
    return [(n>>16)&255, (n>>8)&255, n&255];
  }

  function applyHexFromInput() {
    const rgb = parseHex(hexInput.value);
    if (!rgb) {
      hexHint.textContent = 'Mã hex không hợp lệ (ví dụ #EEEFEA)';
      hexHint.className = 'hex-hint err';
      return;
    }
    const best = reverseToSliders(rgb[0], rgb[1], rgb[2]);
    sliders.black.value  = best.black;
    sliders.yellow.value = best.yellow;
    sliders.red.value    = best.red;
    sliders.blue.value   = best.blue;
    sliders.green.value  = best.green;
    update();

    if (best.dist < 4) {
      hexHint.textContent = 'Đã khớp gần đúng';
      hexHint.className = 'hex-hint ok';
    } else if (best.dist < 18) {
      hexHint.textContent = 'Gần đúng (sai lệch ≈ ' + best.dist.toFixed(1) + ')';
      hexHint.className = 'hex-hint ok';
    } else {
      hexHint.textContent = 'Khó khớp chính xác (sai lệch ≈ ' + best.dist.toFixed(1) + ')';
      hexHint.className = 'hex-hint err';
    }
  }

  // Chuyển RGB (0-255) sang Lab
  function rgbToLab(r, g, b) {
    let [rl, gl, bl] = [r, g, b].map(v => {
      v /= 255;
      return v > 0.04045 ? Math.pow((v + 0.055) / 1.055, 2.4) : v / 12.92;
    });
    let x = (rl * 0.4124 + gl * 0.3576 + bl * 0.1805) / 0.95047;
    let y = (rl * 0.2126 + gl * 0.7152 + bl * 0.0722) / 1.0;
    let z = (rl * 0.0193 + gl * 0.1192 + bl * 0.9505) / 1.08883;
    [x, y, z] = [x, y, z].map(v => v > 0.008856 ? Math.cbrt(v) : (7.787 * v + 16 / 116));
    return [116 * y - 16, 500 * (x - y), 200 * (y - z)];
  }

  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  function findNearestJotun(r, g, b) {
    const [L1, a1, b1] = rgbToLab(r, g, b);
    let best = null, bestDist = Infinity;
    for (const c of JOTUN_COLORS) {
      const [cr, cg, cb] = hexToRgb(c.h);
      const [L2, a2, b2] = rgbToLab(cr, cg, cb);
      const dist = Math.sqrt((L1 - L2) ** 2 + (a1 - a2) ** 2 + (b1 - b2) ** 2);
      if (dist < bestDist) { bestDist = dist; best = c; }
    }
    return { color: best, delta: bestDist };
  }

  const matchSwatch = document.getElementById('match-swatch');
  const matchName = document.getElementById('match-name');
  const matchCode = document.getElementById('match-code');
  const matchDelta = document.getElementById('match-delta');

  function updateMatch(r, g, b) {
    const { color, delta } = findNearestJotun(r, g, b);
    matchSwatch.style.background = color.h;
    matchName.textContent = color.n;
    matchCode.textContent = 'Mã Jotun ' + color.c + ' · ' + color.h;
    let note;
    if (delta < 3) note = 'Gần như trùng khớp';
    else if (delta < 10) note = 'Rất giống';
    else if (delta < 20) note = 'Khá giống';
    else note = 'Chỉ tương đối gần';
    matchDelta.textContent = note + ' (ΔE ≈ ' + delta.toFixed(1) + ')';
  }

    }
    const { r, g, b } = compute();
    const hex = '#' + toHex(r) + toHex(g) + toHex(b);
    swatch.style.background = hex;
    hexInput.value = hex.toUpperCase();
    rgbInput.value = `rgb(${r}, ${g}, ${b})`;
    updateMatch(r, g, b);
  }

  Object.values(sliders).forEach(s => s.addEventListener('input', () => {
    hexHint.textContent = '';
    hexHint.className = 'hex-hint';
    update();
  }));

  hexInput.addEventListener('change', applyHexFromInput);
  hexInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      applyHexFromInput();
      hexInput.blur();
    }
  });
  hexInput.addEventListener('blur', () => {
    if (hexInput.value.trim() && parseHex(hexInput.value)) {
      const current = compute();
      const rgb = parseHex(hexInput.value);
      if (rgb && (rgb[0] !== current.r || rgb[1] !== current.g || rgb[2] !== current.b)) {
        applyHexFromInput();
      }
    }
  });

  document.querySelectorAll('button[data-copy]').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.copy);
      navigator.clipboard.writeText(input.value).then(() => {
        const old = btn.textContent;
        btn.textContent = 'Đã copy';
        setTimeout(() => btn.textContent = old, 1000);
      });
    });
  });

  document.getElementById('reset').addEventListener('click', () => {
    Object.values(sliders).forEach(s => s.value = 0);
    hexHint.textContent = '';
    hexHint.className = 'hex-hint';
    update();
  });

  update();
</script>

</body>
</html>
